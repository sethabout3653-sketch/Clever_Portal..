<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnblockedGames</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            position: relative;
            font-family: Arial, sans-serif;
        }
        
        #embedded-frame {
            width: 100vw;
            height: 100vh;
            border: none;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        #overlay-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2em;
            text-align: center;
        }
        
        #overlay-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .overlay-text {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 3;
            pointer-events: none;
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        /* Full screen styles */
        :fullscreen {
            background-color: #000;
        }
        
        :-webkit-full-screen {
            background-color: #000;
        }
        
        :-moz-full-screen {
            background-color: #000;
        }
        
        :-ms-fullscreen {
            background-color: #000;
        }
    </style>
</head>
<body>
    <iframe id="embedded-frame" src="YOUR_TARGET_URL_HERE" allowfullscreen></iframe>
    <div id="overlay-container">
        <canvas id="overlay-canvas"></canvas>
        <div class="overlay-text" id="title">UnblockedGames</div>
    </div>

    <script>
        // --- Core Embedding Logic ---
        const targetUrl = "https://frogiesarcade.net";
        const iframe = document.getElementById('embedded-frame');
        iframe.src = targetUrl;
        
        // --- Full Screen Support ---
        document.addEventListener('keydown', function(e) {
            // F11 key for fullscreen
            if (e.key === 'F11') {
                e.preventDefault();
                toggleFullScreen();
            }
            // ESC key to exit fullscreen
            else if (e.key === 'Escape' && document.fullscreenElement) {
                exitFullScreen();
            }
        });
        
        // Double click to toggle fullscreen
        document.addEventListener('dblclick', function(e) {
            // Don't trigger if clicking on UI elements
            if (e.target.id !== 'title') {
                toggleFullScreen();
            }
        });
        
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                enterFullScreen();
            } else {
                exitFullScreen();
            }
        }
        
        function enterFullScreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }
        
        function exitFullScreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) { /* Safari */
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) { /* IE11 */
                document.msExitFullscreen();
            }
        }
        
        // Hide UI elements after a delay
        setTimeout(() => {
            const title = document.getElementById('title');
            if (title) {
                title.style.opacity = '0';
                title.style.transition = 'opacity 1s';
            }
        }, 3000);
        
        // --- Non-Savable Transparent Static Image Overlay Logic ---
        const overlayContainer = document.getElementById('overlay-container');
        const canvas = document.getElementById('overlay-canvas');
        const ctx = canvas.getContext('2d');
        
        // Base64 transparent image placeholder
        const imageUrlDataUrl = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
        const overlayImage = new Image();
        let imageLoaded = false;
        
        overlayImage.onload = function() {
            imageLoaded = true;
            const opacity = 0.4;
            const scale = 0.3;
            
            ctx.globalAlpha = opacity;
            
            let drawWidth = overlayImage.width * scale;
            let drawHeight = overlayImage.height * scale;
            
            const targetX = canvas.width / 2 - drawWidth / 2;
            const targetY = canvas.height / 2 - drawHeight / 2;
            
            ctx.drawImage(overlayImage, targetX, targetY, drawWidth, drawHeight);
            ctx.globalAlpha = 1.0;
        };
        
        overlayImage.onerror = function() {
            console.error("Failed to load image for canvas overlay.");
        };
        
        function resizeAndDraw() {
            canvas.width = overlayContainer.offsetWidth;
            canvas.height = overlayContainer.offsetHeight;
            
            if (imageLoaded) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const opacity = 0.4;
                const scale = 0.3;
                
                ctx.globalAlpha = opacity;
                
                let drawWidth = overlayImage.width * scale;
                let drawHeight = overlayImage.height * scale;
                const targetX = canvas.width / 2 - drawWidth / 2;
                const targetY = canvas.height / 2 - drawHeight / 2;
                
                ctx.drawImage(overlayImage, targetX, targetY, drawWidth, drawHeight);
                ctx.globalAlpha = 1.0;
            } else {
                overlayImage.src = imageUrlDataUrl;
            }
        }
        
        resizeAndDraw();
        window.addEventListener('resize', resizeAndDraw);
        
        console.log("Page loaded as 'UnblockedGames'. Full screen support enabled with transparent overlay.");
    </script>
</body>
</html>
