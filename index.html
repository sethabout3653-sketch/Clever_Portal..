<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clever | Loading</title>
    <link rel="icon" type="image/png" href="poop.png" />
    <style>
        :root {
            --bg: #ffffff;
            --clever-width: 290px;
            --clever-up: 95px;
            --book-width: 250px;
            --book-down: 5px;
            --transition-speed: 0.6s;
            --z-loader: 2;
            --z-site: 1;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #0f0;
            background-color: #000;
        }
        .site {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: var(--z-site);
            border: none;
            display: block;
            background: #111;
            box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.3), 0 0 15px rgba(0, 255, 0, 0.5);
        }

        .loading-indicator {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2em;
            text-shadow: 0 0 5px #0f0, 0 0 10px #0f0, 0 0 15px #0f0;
            animation: blink 1.5s infinite steps(1);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <iframe class="site" id="siteFrame" src="about:blank" data-src="https://start.unleashedvr.com/" allowfullscreen title="Clever Portal"></iframe>
    <div class="loading-indicator" id="loadingIndicator">Loading...</div>

    <script>
        (function() {
            const frameElement = document.getElementById('siteFrame');
            const loaderIndicator = document.getElementById('loadingIndicator');

            const originalTitleParts = [
                '\x43\x6c\x65\x76\x65\x72',
                ' | \x4c\x6f\x61\x64\x69\x6e\x67...'
            ];
            document.title = originalTitleParts.join('');

            let flagForUnsavedChanges = true;

            const unloadHandler = function(event) {
                if (!flagForUnsavedChanges) {
                    return;
                }
                const message = '\x43\x68\x61\x6e\x67\x65\x73 \x79\x6f\x75\x20\x6d\x61\x79 \x6e\x6f\x74 \x62\x65 \x73\x61\x76\x65\x64.';
                event.preventDefault();
                event.returnValue = message;
                return message;
            };
            window.addEventListener('beforeunload', unloadHandler);
            window.toggleUnsavedChanges = function(state) {
                flagForUnsavedChanges = Boolean(state);
            };

            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });

            document.addEventListener('keydown', function(e) {
                const isF12 = e.key === 'F12';
                const isCtrlShiftI = e.ctrlKey && e.shiftKey && e.key === 'I';
                const isCtrlU = e.ctrlKey && e.key === 'u';
                if (isF12 || isCtrlShiftI || isCtrlU) {
                    e.preventDefault();
                }
            });

            document.body.style.userSelect =
            document.body.style.webkitUserSelect =
            document.body.style.msUserSelect =
            document.body.style.mozUserSelect = 'none';

            frameElement.setAttribute('sandbox', 'allow-forms allow-scripts allow-same-origin allow-popups allow-modals allow-downloads allow-pointer-lock allow-top-navigation-by-user-activation');
            frameElement.setAttribute('allow', 'autoplay; camera; microphone; geolocation; encrypted-media; display-capture; clipboard-write; web-share; xr-spatial-tracking;');
            frameElement.setAttribute('referrerpolicy', 'unsafe-url');

            let loadAttemptCount = 0;
            const maxAttempts = 10; // Increase attempts for a more persistent "fake" load
            const retryDelayBase = 2000; // Base delay for retries
            const retryDelayMax = 10000; // Max delay to avoid very long waits

            function initiateFrameLoad() {
                loadAttemptCount++;
                const currentRetryDelay = Math.min(retryDelayBase * Math.pow(2, loadAttemptCount - 1) + Math.random() * 1000, retryDelayMax);

                const iframeSource = frameElement.getAttribute('data-src');
                if (!iframeSource) {
                    console.error('Source URL not defined.');
                    return;
                }

                frameElement.src = iframeSource;

                const loadCheckTimer = setTimeout(() => {
                    let isLoaded = false;
                    try {
                        // Heuristic check: if contentDocument is accessible and ready, assume loaded.
                        // Cross-origin restrictions will throw an error, which we also treat as "loaded" for obfuscation.
                        if (frameElement.contentDocument && frameElement.contentDocument.readyState === 'complete') {
                            isLoaded = true;
                        }
                    } catch (e) {
                        // Assume loaded if we can't inspect further due to Same-Origin Policy.
                        isLoaded = true;
                    }

                    if (isLoaded) {
                        loaderIndicator.style.display = 'none';
                        document.title = [originalTitleParts[0], ' | \x50\x6f\x72\x74\x61\x6c'].join('');
                        // Optional: disable unload prompt after successful "load"
                        // window.toggleUnsavedChanges(false);
                    } else {
                        // If not loaded and attempts remain, schedule a retry
                        if (loadAttemptCount < maxAttempts) {
                            setTimeout(initiateFrameLoad, currentRetryDelay);
                        } else {
                            // If max attempts reached, still retry but with a longer, consistent delay
                            setTimeout(initiateFrameLoad, retryDelayMax);
                        }
                    }
                }, 7000); // Initial wait before checking load status

                frameElement.onerror = () => {
                    clearTimeout(loadCheckTimer);
                    // Error occurred, retry with increasing delay
                    if (loadAttemptCount < maxAttempts) {
                        setTimeout(initiateFrameLoad, currentRetryDelay);
                    } else {
                        setTimeout(initiateFrameLoad, retryDelayMax);
                    }
                };
            }

            // Start the simulated loading process
            initiateFrameLoad();

        })();
    </script>
</body>
</html>
