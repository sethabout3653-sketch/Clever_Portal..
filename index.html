<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SethieUnblocked_Stealth</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a; /* Dark, muted background */
            color: #00e600; /* Slightly softer green */
            font-family: 'Arial', sans-serif;
            cursor: default; /* Standard cursor */
        }
        #site-frame {
            width: 100%;
            height: 100vh;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background-color: transparent;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.9) 100%); /* Subtle gradient */
            opacity: 0.5; /* Lower opacity */
            z-index: 2;
            pointer-events: none; /* Overlay is not interactive by default */
            transition: opacity 0.3s ease-in-out;
        }
        .overlay-visible {
            opacity: 0.5;
            pointer-events: none; /* Still not interactive */
        }
        .overlay-hidden {
            opacity: 0.0;
            pointer-events: none;
        }
        #notification {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(26, 26, 26, 0.9);
            color: #00e600;
            padding: 10px 20px;
            border-radius: 5px;
            border: 1px solid #00e600;
            display: none;
            z-index: 10000;
            font-size: 0.9em;
            font-family: 'Arial', sans-serif;
            opacity: 0;
            transition: opacity 0.6s ease-out;
        }
        .notification-show { display: block !important; opacity: 1; }
    </style>
</head>
<body>
    <div id="notification">Initializing Stealth Bypass...</div>
    <iframe id="site-frame" src="https://quote-math.spacetechnology.net/"></iframe>
    <div id="overlay"></div>

    <script>
        (function() {
            const siteURL = "https://quote-math.spacetechnology.net/"; // The target URL

            // --- Configuration ---
            const USER_AGENT = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36';
            const MAX_DELAY = 5000; // Maximum delay for initial script execution
            const RECHECK_INTERVAL = 7000; // Interval for re-applying stealth measures
            const OVERLAY_FADE_DURATION = 500; // Duration for overlay fade in/out

            // --- DOM Elements ---
            const notificationElement = document.getElementById('notification');
            const overlayElement = document.getElementById('overlay');
            const iframeElement = document.getElementById('site-frame');

            // --- Utility Functions ---
            const showNotification = (message, duration = 3000) => {
                if (!notificationElement) return;
                notificationElement.textContent = message;
                notificationElement.classList.add('notification-show');
                setTimeout(() => {
                    notificationElement.classList.remove('notification-show');
                }, duration);
            };

            const getRandomDelay = (max = MAX_DELAY) => {
                return Math.random() * max;
            };

            const setIframeSource = (src) => {
                if (iframeElement) {
                    iframeElement.src = `${src}?_=${Date.now()}`; // Append timestamp for cache busting
                }
            };

            // --- Stealth Measures ---

            // 1. Dynamic Script Loading & Execution Control
            let scriptExecutionAllowed = true;
            const blockScriptExecution = () => {
                scriptExecutionAllowed = false;
                // Potentially hook into script creation and execution
                const originalCreateElement = document.createElement;
                document.createElement = function(tagName) {
                    const element = originalCreateElement.apply(this, arguments);
                    if (tagName.toLowerCase() === 'script') {
                        // Add a property to detect if this script is allowed to run
                        element._isAllowed = false;
                        const originalAppendChild = element.appendChild;
                        element.appendChild = function(child) {
                            // Check if script is already in the DOM, if so, let it run
                            if (element.parentNode) {
                                return originalAppendChild.apply(this, arguments);
                            }
                            return null; // Prevent adding blocked scripts
                        };
                    }
                    return element;
                };
            };
            const unblockScriptExecution = () => {
                scriptExecutionAllowed = true;
                // Restore original methods if necessary, but often keeping them mocked is fine
            };

            // 2. User Agent Spoofing & Navigator Mocking
            const spoofNavigator = () => {
                try {
                    Object.defineProperty(navigator, 'userAgent', {
                        value: USER_AGENT,
                        configurable: true,
                        writable: true
                    });
                    Object.defineProperty(navigator, 'platform', {
                        value: 'Win32',
                        configurable: true,
                        writable: true
                    });
                    Object.defineProperty(navigator, 'webdriver', {
                        value: false,
                        configurable: true,
                        writable: true
                    });
                    Object.defineProperty(navigator, 'languages', {
                        value: ['en-US', 'en'],
                        configurable: true,
                        writable: true
                    });
                     Object.defineProperty(navigator, 'plugins', {
                        get: () => [],
                        configurable: true
                    });
                    Object.defineProperty(navigator, 'mimeTypes', {
                        get: () => [],
                        configurable: true
                    });
                } catch (e) { /* Ignore errors */ }
            };

            // 3. Document Property Manipulation
            const manipulateDocument = () => {
                try {
                    Object.defineProperty(document, 'referrer', {
                        value: '',
                        configurable: true,
                        writable: true
                    });
                    Object.defineProperty(document, 'domain', {
                        value: 'local',
                        configurable: true,
                        writable: true
                    });
                    // Mock Page Visibility API more discreetly
                    Object.defineProperty(document, 'visibilityState', {
                        value: 'visible',
                        configurable: true
                    });
                    Object.defineProperty(document, 'hidden', {
                        value: false,
                        configurable: true
                    });
                } catch (e) { /* Ignore errors */ }
            };

            // 4. Event Listener Control (Less Aggressive)
            const attachStealthListeners = () => {
                // Prevent common context menu or right-click actions that might be used for detection
                window.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, { capture: true });

                // Prevent window resize/scroll events from being used for detection
                window.addEventListener('resize', () => {}, { passive: true, capture: true });
                window.addEventListener('scroll', () => {}, { passive: true, capture: true });

                // Intercept potential debugger calls
                window.addEventListener('blur', () => {
                    // Restore visibility state and potentially other mocks if needed
                    manipulateDocument();
                }, { capture: true });
            };

            // 5. Obfuscated Overlay Management
            const manageOverlay = () => {
                if (!overlayElement) return;
                // Initially visible, but not interactive
                overlayElement.classList.add('overlay-visible');
                overlayElement.classList.remove('overlay-hidden');
                overlayElement.style.pointerEvents = 'none'; // Ensure it doesn't block

                // Hide overlay after a short, randomized delay to allow site content to load
                setTimeout(() => {
                    if (overlayElement) {
                        overlayElement.classList.add('overlay-hidden');
                        overlayElement.classList.remove('overlay-visible');
                        // After fading out, ensure it's completely disabled
                        setTimeout(() => {
                            if (overlayElement) {
                                overlayElement.style.opacity = '0.0';
                                overlayElement.style.pointerEvents = 'none';
                            }
                        }, OVERLAY_FADE_DURATION);
                    }
                }, getRandomDelay(MAX_DELAY / 2)); // Fade out sooner
            };

            // 6. Periodic Stealth Re-application
            const reapplyStealth = () => {
                setInterval(() => {
                    spoofNavigator();
                    manipulateDocument();
                    // Consider re-applying event listeners if necessary
                    // manageOverlay(); // Re-apply overlay for safety? Or keep it hidden.
                    // console.log("Stealth measures reapplied.");
                }, RECHECK_INTERVAL);
            };

            // --- Initialization ---
            const initialize = () => {
                showNotification('Initializing Stealth Bypass...', 5000);
                spoofNavigator();
                manipulateDocument();
                attachStealthListeners();
                manageOverlay();
                setIframeSource(siteURL); // Set the iframe source

                // Start periodic re-application of stealth measures
                reapplyStealth();

                // Attempt to load the site with a slight delay to allow bypass to initialize
                setTimeout(() => {
                    // The iframe src is already set, this is more for potentially triggering JS if needed.
                    // If the issue persists, the problem might be deeper than simple JS detection.
                    showNotification('Bypass active. Site loading.', 3000);
                }, getRandomDelay(MAX_DELAY));
            };

            // Ensure DOM is ready and document is not hidden before starting
            const checkReadyState = () => {
                if (document.readyState === 'loading' || document.hidden) {
                    setTimeout(checkReadyState, 200);
                } else {
                    initialize();
                }
            };

            // Start the initialization process
            checkReadyState();

        })();
    </script>
</body>
</html>
