<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selenite</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0b0d10; height:100vh; display:flex; flex-direction:column; font-family:system-ui,sans-serif; }
    .header { display:flex; align-items:center; justify-content:space-between; padding:0.6rem 1.2rem; background:#14181c; border-bottom:1px solid #2a2f36; flex-shrink:0; }
    .header h1 { color:#c0cbd8; font-size:1.1rem; font-weight:500; }
    .header h1 span { color:#7aa9e6; }
    .btn { background:#1f262e; border:1px solid #343c47; color:#c0cbd8; padding:0.3rem 0.9rem; border-radius:6px; font-size:0.8rem; cursor:pointer; }
    .btn:hover { background:#2a333e; }
    .wrap { flex:1; background:#0a0c0e; }
    .wrap iframe { width:100%; height:100%; border:none; display:block; }
    .fallback { display:none; position:absolute; inset:0; align-items:center; justify-content:center; background:#0b0d10; color:#8e9aab; font-size:0.9rem; text-align:center; padding:2rem; }
    .fallback.show { display:flex; }
    .wrap { position:relative; }
  </style>
</head>
<body>

  <header class="header">
    <h1>⟡ <span>selenite</span>.cc</h1>
    <button class="btn" id="reload">↻ reload</button>
  </header>

  <div class="wrap">
    <iframe id="frame" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    <div class="fallback" id="fallback">⚠️ connection failed</div>
  </div>

  <script>
    var frame = document.getElementById('frame');
    var fallback = document.getElementById('fallback');
    var reloadBtn = document.getElementById('reload');

    function go() {
      fallback.classList.remove('show');
      frame.src = 'https://selenite.cc/?t=' + Date.now();
    }

    frame.onload = function() { fallback.classList.remove('show'); };
    frame.onerror = function() { fallback.classList.add('show'); };

    reloadBtn.onclick = go;

    var timer = setTimeout(function() { fallback.classList.add('show'); }, 15000);
    frame.onload = function() { clearTimeout(timer); fallback.classList.remove('show'); };

    go();
  </script>

</body>
</html>
