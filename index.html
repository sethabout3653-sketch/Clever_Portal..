<!DOCTYPE html>
<html>
<head>
    <title>Embedded Website 2.0</title>
    <style>
        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
    <script>
        // Block GoGuardian's AI
        window.addEventListener('load', function() {
            var iframe = document.querySelector('iframe');
            iframe.src = iframe.src.replace(/goguardian\.com/g, 'example.com');
        });
    </script>
</head>
<body>
    <iframe src="https://www.goguardian.com/" allowfullscreen="true" allow="autoplay; fullscreen"></iframe>
</body>
</html>
