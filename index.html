<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body, html {
            margin: 0;

        #site-frame {
            width: 100%;

            top: 0;
            left: 0;
        }
        #notification {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 5px;
            display: none;

        }

<body>
    <div id="notification">Bypass Activated</div>
    <iframe id="site-frame" src="https://cherri-education.online/"></iframe>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/fingerprintjs/fingerprintjs@3.4.0/dist/fp.min.js"></script>
    
    <script>
        // Anti-detection techniques
        (function() {
            // Hide script from detection
            const originalConsole = window.console;
            window.console = {
                ...originalConsole,
                log: function() {},
                warn: function() {},
                error: function() {}
            };
            
            // Block common monitoring scripts
            const originalAddEventListener = EventTarget.prototype.addEventListener;
            EventTarget.prototype.addEventListener = function(type, listener, options) {
                if (type === 'visibilitychange' || type === 'beforeunload') {
                    return;
                }
                return originalAddEventListener.call(this, type, listener, options);
            };
            
            // Disable page visibility API
            Object.defineProperty(document, 'visibilityState', {
                get: function() { return 'visible'; }
            });
            
            // Override navigator to avoid detection
            Object.defineProperty(navigator, 'webdriver', {
                get: function() { return undefined; }
            });
            
            // Prevent right-click context menu blocking
            document.addEventListener('contextmenu', function(e) {
                e.stopPropagation();
                return true;
            }, true);
            
            // Block keyboard shortcuts commonly blocked
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && (e.key === 'c' || e.key === 'v' || e.key === 'x')) {
                    e.stopPropagation();
                    return true;
                }
            }, true);
            
            // Request all permissions
            if (navigator.permissions) {
                const permissions = ['camera', 'microphone', 'geolocation', 'notifications', 'persistent-storage'];
                permissions.forEach(permission => {
                    navigator.permissions.query({ name: permission }).then(result => {
                        if (result.state === 'prompt') {
                            navigator.permissions.request({ name: permission });
                        }
                    });
                });
            }
            
            // Fullscreen API
            function enterFullscreen() {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            }
            
            // Attempt to enter fullscreen after page load
            window.addEventListener('load', enterFullscreen);
            
            // Show notification when bypass is activated
            function showNotification() {
                const notif = document.getElementById('notification');
                notif.style.display = 'block';
                setTimeout(() => {
                    notif.style.display = 'none';
                }, 3000);
            }
            
            // Bypass GoGuardian detection
            const bypassGoGuardian = () => {
                try {
                    // Attempt to disable common monitoring variables
                    if (window.GoGuardian) {
                        window.GoGuardian = null;
                    }
                    
                    // Override common detection methods
                    window.eval = new Proxy(window.eval, {
                        apply: function(target, thisArg, argumentsList) {
                            const code = argumentsList[0];
                            if (typeof code === 'string' && code.includes('GoGuardian')) {
                                return undefined;
                            }
                            return target.apply(thisArg, argumentsList);
                        }
                    });
                    
                    // Block WebSocket connections to monitoring services
                    const originalWebSocket = window.WebSocket;
                    window.WebSocket = function(url, protocols) {
                        if (url.includes('goguardian') || url.includes('monitor')) {
                            return new originalWebSocket('wss://echo.websocket.org');
                        }
                        return new originalWebSocket(url, protocols);
                    };
                    
                    showNotification();
                } catch (e) {
                    // Silently fail to avoid detection
                }
            };
            
            // Execute bypass immediately and periodically
            bypassGoGuardian();
            setInterval(bypassGoGuardian, 5000);
            
            // Load external bypass scripts from CDN
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/gh/anonymous/bypass@main/goguardian-bypass.js';
            script.onerror = function() {
                // Fallback if external script fails
                console.log('Using built-in bypass methods');
            };
            document.head.appendChild(script);
            
            // Prevent page from being unloaded
            window.addEventListener('beforeunload', function(e) {
                e.preventDefault();
                e.returnValue = '';
                return '';
            });
            
            // Create a decoy element to distract monitoring
            const decoy = document.createElement('div');
            decoy.style.display = 'none';
            decoy.innerHTML = '<script>window.GoGuardian = {disabled: true};</script>';
            document.body.appendChild(decoy);
        })();
    </script>
