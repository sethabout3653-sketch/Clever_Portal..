<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study.com | Settings</title>
<style>
body {

align-items: center;
}
#overlay-canvas {
display: block;
width: 100%;
height: 100%;
}
#loader {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background-color: #000;
display: flex;
justify-content: center;
align-items: center;
z-index: 9999;
color: white;
font-size: 24px;
}

<body>

<div id="loader">Loading content...</div>
<iframe id="embedded-frame" src="about:blank"></iframe>
<div id="overlay-container">
<canvas id="overlay-canvas"></canvas>
</div>

const blockedDomains = ['example.com', 'blocked-site.com', 'restricted.com'];
const targetUrl = "https://example.com"; // Replace with your target URL

// Check if URL is blocked
function isBlocked(url) {
    try {
        const urlObj = new URL(url);
        return blockedDomains.some(domain => urlObj.hostname.includes(domain));
    } catch (e) {
        return false;
    }
}

// Create a hidden proxy for blocked content
function createProxyUrl(originalUrl) {
    // Using a CORS proxy service to bypass restrictions

    return `https://cors-anywhere.herokuapp.com/\${originalUrl}`;
}

// Anti-Deledao protection system - completely hidden
const overlayContainer = document.getElementById('overlay-container');
const canvas = document.getElementById('overlay-canvas');
const ctx = canvas.getContext('2d');
const iframe = document.getElementById('embedded-frame');
const loader = document.getElementById('loader');

// Hidden protection layers
let protectionLayers = [];
let protectionActive = false;

// Initialize protection layers - completely invisible to user
function initProtectionLayers() {
    // Layer 1: Invisible static noise
    protectionLayers.push({
        type: 'static',
        opacity: 0.05, // Very low opacity to be nearly invisible
        frequency: 100
    });
    
    // Layer 2: Ultra-subtle moving pattern
    protectionLayers.push({
        type: 'pattern',
        opacity: 0.03, // Almost completely transparent
        speed: 0.2
    });
    
    // Layer 3: Color shifting with minimal visibility
    protectionLayers.push({
        type: 'colorShift',
        opacity: 0.02, // Barely visible
        speed: 0.1
    });
    
    // Layer 4: Micro pixel blocks
    protectionLayers.push({
        type: 'blocks',
        opacity: 0.04, // Very subtle
        blockSize: 5,
        frequency: 300
    });
}

// Create static noise layer - optimized for invisibility
function createStaticNoise(opacity) {
    const imageData = ctx.createImageData(canvas.width, canvas.height);
    const data = imageData.data;
    
    for (let i = 0; i < data.length; i += 4) {
        // Very subtle random color values
        const value = Math.floor(Math.random() * 20) + 235; // Light values only
        data[i] = value;     // Red
        data[i + 1] = value; // Green
        data[i + 2] = value; // Blue
        data[i + 3] = Math.floor(opacity * 255); // Alpha
    }
    
    ctx.putImageData(imageData, 0, 0);
}

// Create ultra-subtle moving pattern
function createMovingPattern(opacity, speed, time) {
    ctx.globalAlpha = opacity;
    
    // Create a very subtle wave pattern
    const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
    const offset = (time * speed) % 1;
    
    gradient.addColorStop(0, `rgba(245, 245, 245, 0.05)`);
    gradient.addColorStop(offset, `rgba(240, 240, 255, 0.06)`);
    gradient.addColorStop((offset * 2) % 1, `rgba(245, 240, 240, 0.05)`);
    gradient.addColorStop(1, `rgba(240, 245, 240, 0.05)`);
    
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.globalAlpha = 1;
}

// Create color shifting layer - optimized for subtlety
function createColorShift(opacity, speed, time) {
    ctx.globalAlpha = opacity;
    
    // Create a very subtle color shifting effect
    const hue = (time * speed * 100) % 360;
    ctx.fillStyle = `hsla(\${hue}, 20%, 95%, 0.05)`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    ctx.globalAlpha = 1;
}

// Create micro pixel blocks - almost invisible
function createPixelBlocks(opacity, blockSize, frequency, time) {
    ctx.globalAlpha = opacity;
    
    const blocksX = Math.ceil(canvas.width / blockSize);
    const blocksY = Math.ceil(canvas.height / blockSize);
    
    // Use time as a seed for pseudo-randomness
    const seed = Math.floor(time / 1000);
    
    for (let x = 0; x < blocksX; x++) {
        for (let y = 0; y < blocksY; y++) {
            // Pseudo-random based on position and seed
            const random = Math.sin(seed * 12.9898 + x * 78.233 + y * 43.133) * 43758.5453;
            const value = (random - Math.floor(random)) * 50 + 205; // Light values only
            
            ctx.fillStyle = `rgba(${value}, ${255-value/2}, \${Math.abs(240-value/2)}, 0.1)`;
            ctx.fillRect(x * blockSize, y * blockSize, blockSize, blockSize);
        }
    }
    
    ctx.globalAlpha = 1;
}

// Update all protection layers
function updateProtectionLayers(time) {
    if (!protectionActive) return;
    
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Apply each protection layer
    protectionLayers.forEach(layer => {
        switch (layer.type) {
            case 'static':
                createStaticNoise(layer.opacity);
                break;
            case 'pattern':
                createMovingPattern(layer.opacity, layer.speed, time);
                break;
            case 'colorShift':
                createColorShift(layer.opacity, layer.speed, time);
                break;
            case 'blocks':
                createPixelBlocks(layer.opacity, layer.blockSize, layer.frequency, time);
                break;
        }
    });
}

// Function to resize canvas and redraw
function resizeAndDraw() {
    canvas.width = overlayContainer.offsetWidth;
    canvas.height = overlayContainer.offsetHeight;
}

// Animation loop
function animate(time) {
    updateProtectionLayers(time);
    requestAnimationFrame(animate);
}

// URL detection and bypass
function loadContent() {
    let urlToLoad = targetUrl;
    
    // Check if URL is blocked and needs bypass
    if (isBlocked(targetUrl)) {
        urlToLoad = createProxyUrl(targetUrl);
        console.log("Using proxy for blocked content");
    }
    
    // Load the content
    iframe.src = urlToLoad;
    
    // Wait for iframe to load
    iframe.onload = function() {
        // Hide loader
        setTimeout(() => {
            loader.style.display = 'none';
            // Start protection after content loads
            protectionActive = true;
        }, 1000);
    };
    
    // Handle iframe errors
    iframe.onerror = function() {
        console.log("Error loading content, trying alternative method");
        // Try alternative loading method
        tryAlternativeLoading();
    };
}

// Alternative loading method for blocked content
function tryAlternativeLoading() {
    // Create a data URL with a simple HTML page that loads the target via script
    const dataUrl = `data:text/html,<html><head><title>Educational Content</title></head><body style="margin:0;padding:0;overflow:hidden">
    <iframe src="\${targetUrl}" style="width:100%;height:100%;border:none"></iframe>
    </body></html>`;
    
    iframe.src = dataUrl;
    
    iframe.onload = function() {
        setTimeout(() => {
            loader.style.display = 'none';
            protectionActive = true;
        }, 1000);
    };
}
