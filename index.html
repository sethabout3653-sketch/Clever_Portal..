<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lucide</title>
  <style>
    /* Reset layout margins */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      cursor: none; /* Hide default browser cursor */
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* JavaScript Cursor Canvas/Image Element */
    #js-custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      pointer-events: none; /* Allows direct interaction with iframe elements underneath */
      z-index: 999999;
      display: none;
      transform: translate(-0px, -0px); /* Custom cursor offset alignment */
      will-change: transform;
    }
  </style>
</head>
<body>

  <div class="container" id="app-container">
    <iframe 
      id="main-iframe"
      src="https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/logo.svg#/"
      allow="fullscreen; microphone; camera; display-capture; autoplay; clipboard-write; web-share"
      allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms"
    >
    </iframe>
  </div>

  <!-- Dynamic JS-rendered Cursor Image -->
  <img id="js-custom-cursor" src="https://pngimg.com/uploads/cursor/cursor_PNG50.png" alt="Custom Cursor" />

  <script>
    (function () {
      const cursorImg = document.getElementById('js-custom-cursor');
      const container = document.getElementById('app-container');
      const iframe = document.getElementById('main-iframe');

      let mouseX = 0;
      let mouseY = 0;
      let isVisible = false;

      // Update cursor position directly via JS transform
      function updateCursorPosition() {
        if (isVisible) {
          cursorImg.style.display = 'block';
          cursorImg.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
        } else {
          cursorImg.style.display = 'none';
        }
      }

      // Track pointer movement across window context
      window.addEventListener('pointermove', (event) => {
        mouseX = event.clientX;
        mouseY = event.clientY;
        isVisible = true;
        requestAnimationFrame(updateCursorPosition);
      });

      // Handle pointer leaving the document boundaries
      document.addEventListener('mouseleave', () => {
        isVisible = false;
        updateCursorPosition();
      });

      // Maintain hover coordinates when moving towards iframe edge
      container.addEventListener('pointerover', (event) => {
        mouseX = event.clientX;
        mouseY = event.clientY;
        isVisible = true;
        requestAnimationFrame(updateCursorPosition);
      });
    })();
  </script>

</body>
</html>
