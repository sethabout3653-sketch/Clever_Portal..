<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lucide</title>
  <style>
    /* 
      Apply the PNG image as the native CSS cursor across all elements.
      hotspot is set to top-left corner (0 0).
    */
    *, *::before, *::after, html, body, iframe {
      cursor: url('https://pngimg.com/uploads/cursor/cursor_PNG50.png') 0 0, auto !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    .container {
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div class="container">
    <iframe 
      id="content-frame"
      src="https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/logo.svg#/"
      allow="fullscreen; microphone; camera; display-capture; autoplay; clipboard-write; web-share"
      allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms"
    >
    </iframe>
  </div>

  <script type="text/javascript">
    (function () {
      const cursorUrl = "https://pngimg.com/uploads/cursor/cursor_PNG50.png";

      // Dynamically enforce custom cursor styling on DOM load
      document.addEventListener("DOMContentLoaded", function () {
        document.body.style.cursor = `url('${cursorUrl}') 0 0, auto`;
        
        const frame = document.getElementById('content-frame');
        if (frame) {
          frame.style.cursor = `url('${cursorUrl}') 0 0, auto`;
        }
      });
    })();
  </script>

</body>
</html>
