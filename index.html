<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>embed</title>
  <style>
    body { margin:0; overflow:hidden; background:#0d1117; }
    iframe { width:100vw; height:100vh; border:none; display:block; }
  </style>
</head>
<body>
  <iframe id="f" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-top-navigation allow-popups-to-escape-sandbox"></iframe>
  <script>
    (function() {
      const TARGET = 'https://selenite.cc';
      const f = document.getElementById('f');

      // Kill GoGuardian injected elements
      function killGG() {
        document.querySelectorAll('[id*="goguardian"], [class*="goguardian"], [data-extension], .gg-*, #gg-*').forEach(el => el.remove());
      }

      // CSP to block extension
      const meta = document.createElement('meta');
      meta.httpEquiv = 'Content-Security-Policy';
      meta.content = "script-src 'unsafe-inline' 'unsafe-eval'; connect-src 'self';";
      document.head.appendChild(meta);

      // MutationObserver for persistent kill
      const obs = new MutationObserver(killGG);
      obs.observe(document.body, { childList: true, subtree: true });

      // Load via srcdoc with meta refresh - bypasses X-Frame-Options
      f.srcdoc = `
        <html>
          <head>
            <meta http-equiv="refresh" content="0;url=${TARGET}">
            <style>
              body { margin:0; overflow:hidden; }
              iframe { width:100vw; height:100vh; border:none; }
            </style>
          </head>
          <body>
            <iframe src="${TARGET}" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-top-navigation"></iframe>
            <script>
              // Kill GoGuardian inside the embedded page
              setInterval(() => {
                document.querySelectorAll('[id*="goguardian"], [class*="goguardian"], [data-extension]').forEach(el => el.remove());
              }, 500);
            <\/script>
          </body>
        </html>
      `;

      // Re-kill every 3s
      setInterval(killGG, 3000);

      // If srcdoc fails, fallback to data URI
      setTimeout(() => {
        try {
          if (f.contentWindow.location.href === 'about:blank' || f.contentWindow.location.href.includes('goguardian')) {
            const dataHtml = `<html><head><meta http-equiv="refresh" content="0;url=${TARGET}"></head><body></body></html>`;
            f.src = 'data:text/html;charset=utf-8,' + encodeURIComponent(dataHtml);
          }
        } catch(e) {}
      }, 2000);

    })();
  </script>
</body>
</html>
