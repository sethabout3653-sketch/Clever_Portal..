<!DOCTYPE html>

<title>Fullscreen Embedded Website - Evasion Attempt</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background-color: #000; /* Fallback background */
    }

    .iframe-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        z-index: 1; /* Start with a base z-index */
    }

    #static-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; /* Allows clicks to pass through to iframes below */
        background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACpDid1AAAAIElEQVQIW2P8//8/A8GkQBQoowj6gM0E4rIAAIQABGgAFJBAwAAAAABJRU5ErkJggg=='); /* Tiny repeating black dot pattern */
        background-size: 2px 2px;
        animation: glitch 2s infinite linear alternate-reverse;
        z-index: 100; /* High z-index to be on top */
        opacity: 0.5; /* Make it somewhat visible */
        display: none; /* Hidden by default, JS will show it */
    }

    @keyframes glitch {
        0% {
            background-position: 0 0;
        }
        10% {
            background-position: -2px 0;
        }
        20% {
            background-position: 0 -2px;
        }
        30% {
            background-position: -2px -2px;
        }
        40% {
            background-position: 0 0;
        }
        50% {
            background-position: 2px 2px;
        }
        60% {
            background-position: 0 2px;
        }
        70% {
            background-position: 2px 0;
        }
        80% {
            background-position: 2px 2px;
        }
        90% {
            background-position: 0 0;
        }
        100% {
            background-position: -2px 0;
        }
    }

    .hidden-content {
        display: none; /* Initially hide the actual content */
    }
</style>
</head>
<body>

    <!-- Static Image Overlay -->
    <div id="static-overlay"></div>

    <!-- Layered Iframes -->
    <!-- We'll use multiple iframes with different z-indexes -->
    <!-- The idea is that if one is blocked, others might be accessible -->
    <!-- Or if one tries to close, others might be unaffected -->

    <iframe class="iframe-layer" src="https://www.google.com" style="z-index: 2;" title="Layer 1"></iframe>
    <iframe class="iframe-layer" src="https://www.bing.com" style="z-index: 3;" title="Layer 2"></iframe>
    <iframe class="iframe-layer" src="https://duckduckgo.com" style="z-index: 4;" title="Layer 3"></iframe>
    <!-- Add more iframes as needed with incrementing z-indexes -->

    <div id="hidden-content" class="hidden-content">
        <!-- This is where your actual content would go if you wanted to dynamically load it -->
        <!-- For this example, we're just using external sites -->
    </div>

    <script>
        const targetUrl = "https://example.com"; // The website you *really* want to show
        const iframeSources = [
            "https://www.google.com",
            "https://www.bing.com",
            "https://duckduckgo.com",
            "https://www.yahoo.com" // Example of another one
        ];

        let currentLayer = 0;
        const iframeContainer = document.body; // Or a specific container div

        // Function to attempt to create a new iframe
        function createIframe(src, zIndex) {
            const iframe = document.createElement('iframe');
            iframe.src = src;
            iframe.className = 'iframe-layer';
            iframe.style.zIndex = zIndex;
            iframe.title = `Layer ${zIndex}`;
            iframe.onerror = () => console.log(`Error loading iframe: ${src}`);
            iframe.onload = () => console.log(`Iframe loaded: ${src}`);
            iframeContainer.appendChild(iframe);
            return iframe;
        }

        // "Anti-deleado" - Basic attempt to keep iframes alive
        // This is very rudimentary. It checks if the primary iframe (if it existed)
        // is still in the DOM. A more complex version would monitor all iframes
        // and try to replace them if they disappear.
        const mainIframeCheckInterval = setInterval(() => {
            const iframes = document.getElementsByClassName('iframe-layer');
            if (iframes.length === 0) {
                console.log("All iframes removed. Attempting to restore.");
                // Restore the main content iframe
                createIframe(targetUrl, 5); // Use a higher z-index for the target
                // Restore backup iframes
                for (let i = 0; i < iframeSources.length; i++) {
                    if (i < 3) { // Only restore a few backups
                        createIframe(iframeSources[i], i + 2);
                    }
                }
            }
            // More advanced checks could look for specific messages or DOM changes
        }, 5000); // Check every 5 seconds

        // Make the static overlay visible and animate it
        document.getElementById('static-overlay').style.display = 'block';

        // --- Dynamic Iframe Management (Optional, more complex) ---
        // This part shows how you might dynamically manage iframes,
        // perhaps trying to load the target URL first and backups if it fails.

        // --- Evasion Tactics ---
        // 1. Multiple Iframes: Makes it harder to block all.
        // 2. Static Overlay: Attempts to mask or confuse detection tools, and gives a "glitchy" look.
        //    The 'pointer-events: none;' is crucial so clicks go through to the iframes.
        //    The 'opacity' makes it partially see-through.
        // 3. Basic "Anti-Deleado": Tries to re-add iframes if they are all gone. This is weak.
        // 4. Z-index stacking: Ensures the static is on top, but still interactive.

        // --- What this DOES NOT do (and is hard to achieve) ---
