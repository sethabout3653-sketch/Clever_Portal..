<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lucide</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      cursor: none !important;
    }

    *, *::before, *::after {
      cursor: none !important;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Transparent layer to capture mouse movements across the whole viewport */
    #tracker-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 999998;
      background: transparent;
      pointer-events: none;
    }

    /* Custom Windows 11 Green Cursor Container */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 28px;
      height: 38px;
      pointer-events: none;
      z-index: 999999;
      will-change: transform;
      transform: translate3d(-100px, -100px, 0);
    }
  </style>
</head>
<body>

  <!-- Custom SVG Cursor with Windows 11 Geometry, Green Fill & Thick Black Outline -->
  <div id="custom-cursor">
    <svg width="28" height="38" viewBox="0 0 28 38" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path 
        d="M2.5 2.5L25.5 20.5H14.5L21.5 35.5L16.5 37.5L9.5 22.5L2.5 28.5V2.5Z" 
        fill="#00FF66" 
        stroke="#000000" 
        stroke-width="3" 
        stroke-linejoin="round"
        stroke-linecap="round"
      />
    </svg>
  </div>

  <iframe 
    src="https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/logo.svg#/"
    allow="fullscreen; microphone; camera; display-capture; autoplay; clipboard-write; web-share"
    allowfullscreen
    sandbox="allow-scripts allow-same-origin allow-forms"
  >
  </iframe>

  <script>
    const cursor = document.getElementById('custom-cursor');

    // Hardware-accelerated pointer tracking
    window.addEventListener('pointermove', (e) => {
      cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
    }, { capture: true, passive: true });

    // Fallback tracking for window mousemove
    window.addEventListener('mousemove', (e) => {
      cursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
    }, { capture: true, passive: true });
  </script>

</body>
</html>
