<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnblockedGames</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Hide scrollbars */
            background-color: #000; /* Black background for immersion */
            position: relative; /* Needed for absolute positioning of children */
            font-family: Arial, sans-serif; /* Basic font for any text */
        }
        #embedded-frame {
            width: 100vw;
            height: 100vh;
            border: none; /* No border */
            display: block; /* Remove extra space below the frame */
            position: relative; /* Ensure it stays behind the overlay */
            z-index: 1; /* Below the overlay */
        }
        #overlay-container {
            position: absolute; /* Position it over everything */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2; /* Above the iframe */
            pointer-events: none; /* Crucial: Allows clicks to pass through to the iframe */
            display: flex; /* Use flexbox for centering content */
            justify-content: center; /* Center horizontally */
            align-items: center; /* Center vertically */
            color: rgba(255, 255, 255, 0.8); /* Default text color for overlay */
            font-size: 1.2em; /* Default font size */
            text-align: center;
        }
        #overlay-canvas {
            display: block; /* Remove extra space below canvas */
            width: 100%; /* Make canvas fill its container */
            height: 100%;
        }
        /* Style for any text you might want to display over the canvas */
        .overlay-text {
            position: absolute;
            top: 10px; /* Position from the top */
            left: 10px; /* Position from the left */
            z-index: 3; /* Ensure text is above canvas if needed, but still below pointer-events:none */
            pointer-events: none; /* Text should also not block clicks */
            color: rgba(255, 255, 255, 0.9); /* White text, slightly transparent */
            font-size: 1.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); /* Add shadow for readability */
        }
    </style>
</head>
<body>

    <iframe id="embedded-frame" src="YOUR_TARGET_URL_HERE"></iframe>
    <div id="overlay-container">
        <canvas id="overlay-canvas"></canvas>
        <div class="overlay-text">UnblockedGames</div>
    </div>

    <script>
        // --- Core Embedding Logic ---
        const targetUrl = "https://example.com"; // !!! REPLACE WITH YOUR ACTUAL TARGET WEBSITE !!!
        const iframe = document.getElementById('embedded-frame');
        iframe.src = targetUrl;

        // --- Non-Savable Transparent Static Image Overlay Logic ---
        const overlayContainer = document.getElementById('overlay-container');
        const canvas = document.getElementById('overlay-canvas');
        const ctx = canvas.getContext('2d');

        // !!! REPLACE THIS BASE64 STRING WITH YOUR IMAGE'S BASE64 ENCODED DATA !!!
        // This is a small, transparent 1x1 pixel image as a placeholder.
        // For a more "static" feel, use an image that doesn't rely on dynamic generation.
        // Example: Convert your static image (e.g., a logo) to a base64 string.
        // You can use online converters for this.
        // Example Data URL for a small transparent PNG:
        const imageUrlDataUrl = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';
        // !!! IMPORTANT: Replace the above placeholder with your actual static image's Base64 Data URL !!!

        const overlayImage = new Image();
        let imageLoaded = false;

        overlayImage.onload = function() {
            imageLoaded = true;
            // --- Drawing Configuration ---
            // These settings define how the static image is displayed on the canvas.
            // Since the request is for a "transparent one" and "static," we'll draw
            // it once and ensure it covers appropriately without tiling by default.

            const opacity = 0.4; // Transparency of the image (0.0 to 1.0). Adjust as needed.
            const scale = 0.3;   // Scale factor for the image if drawn as a single instance.
                                // Adjust this to make the image larger or smaller.
                                // Set to 1 if you want original size, or adjust for desired fit.

            ctx.globalAlpha = opacity; // Set the transparency for the drawn image.

            // Calculate dimensions to maintain aspect ratio for a single instance
            let drawWidth = overlayImage.width * scale;
            let drawHeight = overlayImage.height * scale;

            // Center the image on the canvas
            const targetX = canvas.width / 2 - drawWidth / 2;
            const targetY = canvas.height / 2 - drawHeight / 2;

            // Draw the image once onto the canvas.
            // No tiling is used by default to ensure it's a single "static" element.
            ctx.drawImage(overlayImage, targetX, targetY, drawWidth, drawHeight);

            ctx.globalAlpha = 1.0; // Reset alpha to default.
        };

        overlayImage.onerror = function() {
            console.error("Failed to load image for canvas overlay. Please check the imageUrlDataUrl.");
            // Optionally, draw a placeholder or error message
            ctx.fillStyle = 'rgba(255, 0, 0, 0.5)'; // Red overlay
            ctx.font = '20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('Image Load Error', canvas.width / 2, canvas.height / 2);
        };

        // Function to resize canvas and redraw the image
        function resizeAndDraw() {
            canvas.width = overlayContainer.offsetWidth;
            canvas.height = overlayContainer.offsetHeight;

            if (imageLoaded) {
                // Redraw the image after resizing
                // Clear the canvas first to avoid drawing multiple images
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const opacity = 0.4; // Re-apply opacity
                const scale = 0.3;   // Re-apply scale

                ctx.globalAlpha = opacity;

                let drawWidth = overlayImage.width * scale;
                let drawHeight = overlayImage.height * scale;
                const targetX = canvas.width / 2 - drawWidth / 2;
                const targetY = canvas.height / 2 - drawHeight / 2;

                ctx.drawImage(overlayImage, targetX, targetY, drawWidth, drawHeight);
                ctx.globalAlpha = 1.0;
            } else {
                // If image not loaded yet, set source
                overlayImage.src = imageUrlDataUrl;
            }
        }

        // Initial setup and event listener for window resize
        resizeAndDraw();
        window.addEventListener('resize', resizeAndDraw);

        // Note on "Non-Savable" and "When Right Clicked":
        // 1. Canvas Rendering: The image is drawn onto a canvas. This means there's no direct `<img>` tag or CSS background to right-click and "Save Image As..." directly.
        // 2. Pointer Events: The `#overlay-container` has `pointer-events: none;`. This is critical. It ensures that clicks and context menus (right-clicks) are passed through to the `<iframe>` element beneath, allowing users to interact with the embedded website. The overlay itself doesn't intercept these actions.
        // 3. Data URL: Using a Base64 encoded Data URL for `imageUrlDataUrl` embeds the image data directly into the script. This makes it harder to find a distinct image file source to save.
        // 4. "Static" Nature: The script draws the image once on load and redraws it on resize. It's not animated or dynamically changing, fulfilling the "static" requirement.
        // 5. Transparency: Achieved via the `opacity` setting and the nature of the image data itself (if your original image is transparent).

        console.log("Page loaded as 'UnblockedGames'. Transparent, non-savable static image overlay is active, allowing interaction with the embedded website.");

    </script>

</body>
</html>
