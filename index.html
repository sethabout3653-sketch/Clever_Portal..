<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SethieUnblocked_Core</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            color: #00e600;
            font-family: 'Arial', sans-serif;
            cursor: default;
        }
        #site-frame {
            width: 100%;
            height: 100vh;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background-color: transparent;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.9) 100%);
            opacity: 0.0;
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }
        .overlay-visible { opacity: 0.5; pointer-events: none; }
        .overlay-hidden { opacity: 0.0; pointer-events: none; }
        #notification {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(26, 26, 26, 0.9);
            color: #00e600;
            padding: 10px 20px;
            border-radius: 5px;
            border: 1px solid #00e600;
            display: none;
            z-index: 10000;
            font-size: 0.9em;
            font-family: 'Arial', sans-serif;
            opacity: 0;
            transition: opacity 0.6s ease-out;
        }
        .notification-show { display: block !important; opacity: 1; }
    </style>
</head>
<body>
    <div id="notification">Initializing Core Bypass...</div>
    <iframe id="site-frame" src="about:blank"></iframe>
    <div id="overlay"></div>

    <script>
        (function() {
            // --- Configuration ---
            const TARGET_URL = "https://literature.easternstamps.com"; // Primary target
            const USER_AGENT = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36';
            const MAX_INIT_DELAY = 5000;
            const RECHECK_INTERVAL = 8000;
            const OVERLAY_FADE_DURATION = 600;

            // --- DOM Elements ---
            const notificationElement = document.getElementById('notification');
            const overlayElement = document.getElementById('overlay');
            const iframeElement = document.getElementById('site-frame');

            // --- Utility Functions ---
            const showNotification = (message, duration = 3000) => {
                if (!notificationElement) return;
                notificationElement.textContent = message;
                notificationElement.classList.add('notification-show');
                setTimeout(() => {
                    notificationElement.classList.remove('notification-show');
                }, duration);
            };

            const getRandomDelay = (max = MAX_INIT_DELAY) => {
                return Math.random() * max;
            };

            const setIframeSource = (src) => {
                if (iframeElement) {
                    iframeElement.src = `${src}?_=${Date.now()}`;
                }
            };

            // --- Stealth Measures ---
            const applyGlobalMocks = () => {
                try {
                    // User Agent Spoofing
                    Object.defineProperty(navigator, 'userAgent', {
                        value: USER_AGENT,
                        configurable: true,
                        writable: true
                    });
                    // Platform Spoofing
                    Object.defineProperty(navigator, 'platform', {
                        value: 'Win32',
                        configurable: true,
                        writable: true
                    });
                    // WebDriver Detection Bypass
                    Object.defineProperty(navigator, 'webdriver', {
                        value: false,
                        configurable: true,
                        writable: true
                    });
                    // Language Spoofing
                    Object.defineProperty(navigator, 'languages', {
                        value: ['en-US', 'en'],
                        configurable: true,
                        writable: true
                    });
                    // Plugin/MimeType Spoofing (empty lists)
                    Object.defineProperty(navigator, 'plugins', { get: () => [], configurable: true });
                    Object.defineProperty(navigator, 'mimeTypes', { get: () => [], configurable: true });

                    // Document Properties Spoofing
                    Object.defineProperty(document, 'referrer', {
                        value: '',
                        configurable: true,
                        writable: true
                    });
                    Object.defineProperty(document, 'domain', {
                        value: 'local', // A common spoofed value
                        configurable: true,
                        writable: true
                    });
                    Object.defineProperty(document, 'visibilityState', { value: 'visible', configurable: true });
                    Object.defineProperty(document, 'hidden', { value: false, configurable: true });

                    // Mocking specific detection-related JavaScript APIs
                    window.chrome = {}; // Mock chrome object if it exists

                    // Prevent dynamic iframe injection attempts by detection scripts
                    const observer = new MutationObserver(mutations => {
                        mutations.forEach(mutation => {
                            mutation.addedNodes.forEach(node => {
                                if (node.nodeType === 1 && node.tagName === 'IFRAME') {
                                    const iframeSrc = node.src;
                                    if (!iframeSrc || !iframeSrc.startsWith('data:')) {
                                        node.src = 'about:blank'; // Block external iframes
                                    }
                                }
                            });
                        });
                    });
                    // Observe changes in the body or document element
                    observer.observe(document.body || document.documentElement, { childList: true, subtree: true });

                } catch (e) { /* Ignore errors during mocking */ }
            };

            // Console Mocking
            const mockConsole = () => {
                try {
                    const originalConsole = Object.assign({}, window.console);
                    window.console = {};
                    const methods = ['log', 'warn', 'error', 'info', 'debug', 'table', 'dir', 'dirxml', 'trace', 'assert', 'count', 'countReset', 'group', 'groupCollapsed', 'groupEnd', 'time', 'timeEnd', 'profile', 'profileEnd'];
                    methods.forEach(method => {
                        window.console[method] = function() {
                            // Optionally, you could still log to the original console for debugging purposes
                            // if (originalConsole[method]) {
                            //     originalConsole[method].apply(originalConsole, arguments);
                            // }
                        };
                    });
                } catch (e) { /* Ignore errors */ }
            };

            // Event Listeners for Stealth
            const attachStealthListeners = () => {
                // Prevent right-click context menu
                window.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, { capture: true });

                // Minimal listeners that don't leak much info
                window.addEventListener('resize', () => {}, { passive: true, capture: true });
                window.addEventListener('scroll', () => {}, { passive: true, capture: true });

                // Re-apply mocks on window blur to counteract potential re-enabling of detection
                window.addEventListener('blur', () => {
                    setTimeout(applyGlobalMocks, 100);
                    mockConsole(); // Re-mock console
                }, { capture: true });
            };

            // Overlay Management - brief flash then hidden
            const manageOverlay = () => {
                if (!overlayElement) return;
                overlayElement.style.opacity = '0.0';
                overlayElement.style.pointerEvents = 'none';
                overlayElement.classList.remove('overlay-visible');
                overlayElement.classList.add('overlay-hidden');

                setTimeout(() => {
                    if (overlayElement) {
                        overlayElement.classList.add('overlay-visible');
                        overlayElement.style.pointerEvents = 'none';
                    }
                    setTimeout(() => {
                        if (overlayElement) {
                            overlayElement.classList.add('overlay-hidden');
                            overlayElement.classList.remove('overlay-visible');
                            overlayElement.style.pointerEvents = 'none';
                        }
                    }, OVERLAY_FADE_DURATION);
                }, getRandomDelay(MAX_INIT_DELAY / 2));
            };

            // Periodic Re-application
            const reapplyStealthPeriodically = () => {
                setInterval(() => {
                    applyGlobalMocks();
                    mockConsole();
                }, RECHECK_INTERVAL);
            };

            // --- Initialization ---
            const initialize = () => {
                showNotification('Initializing Core Bypass...', 5000);
                applyGlobalMocks();
                mockConsole();
                attachStealthListeners();
                manageOverlay();
                setIframeSource(TARGET_URL);

                reapplyStealthPeriodically();

                setTimeout(() => {
                    showNotification(`Bypass active. Targeting: ${TARGET_URL.split('//')[1].split('/')[0]}`, 4000);
                }, getRandomDelay(MAX_INIT_DELAY));
            };

            const checkReadyState = () => {
                if (document.readyState === 'loading' || document.hidden) {
                    setTimeout(checkReadyState, 200);
                } else {
                    if (iframeElement) iframeElement.src = "about:blank";
                    setTimeout(initialize, getRandomDelay(1000));
                }
            };

            checkReadyState();

        })();
    </script>
</body>
</html>
