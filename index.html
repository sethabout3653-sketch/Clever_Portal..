<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study.com | Settings</title>
<style>
body {
margin: 0;
overflow: hidden;
background-color: #000;
position: relative;
font-family: Arial, sans-serif;
}
#embedded-frame {
width: 100vw;
height: 100vh;
border: none;
display: block;
position: relative;
z-index: 1;
}
#overlay-container {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
z-index: 2;
pointer-events: none;
display: flex;
justify-content: center;
align-items: center;
}
#overlay-canvas {
display: block;
width: 100%;
height: 100%;
}
</style>
</head>
<body>

<iframe id="embedded-frame" src="YOUR_TARGET_URL_HER"></iframe>
<div id="overlay-container">
<canvas id="overlay-canvas"></canvas>
</div>

<script>
// Anti-Deledao functionality
const targetUrl = "https://frogiesarcade.net/"; // Replace with your target URL
const iframe = document.getElementById('embedded-frame');
iframe.src = targetUrl;

// Anti-Deledao overlay
const overlayContainer = document.getElementById('overlay-container');
const canvas = document.getElementById('overlay-canvas');
const ctx = canvas.getContext('2d');

// Static transparent overlay image
const imageUrlDataUrl = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=';

// Create a more complex static overlay pattern
function createStaticOverlay() {
    const imageData = ctx.createImageData(canvas.width, canvas.height);
    const data = imageData.data;
    
    // Create a static noise pattern
    for (let i = 0; i < data.length; i += 4) {
        // Random grayscale value with very low opacity to create subtle static
        const value = Math.floor(Math.random() * 30);
        data[i] = value;     // Red
        data[i + 1] = value; // Green
        data[i + 2] = value; // Blue
        data[i + 3] = 20;    // Alpha (very transparent)
    }
    
    ctx.putImageData(imageData, 0, 0);
}

// Function to resize canvas and redraw the overlay
function resizeAndDraw() {
    canvas.width = overlayContainer.offsetWidth;
    canvas.height = overlayContainer.offsetHeight;
    createStaticOverlay();
}

// Initial setup and event listener for window resize
resizeAndDraw();
window.addEventListener('resize', resizeAndDraw);

// Redraw the static overlay periodically to maintain the anti-detection effect
setInterval(createStaticOverlay, 500);

console.log("Anti-Deledao protection is active");
</script>

</body>
</html>
