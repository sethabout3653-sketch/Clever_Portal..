<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gamesfr</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            cursor: none !important;
        }

        body *,
        body *::before,
        body *::after {
            cursor: none !important;
        }

        /* =========================================================
           MAIN IFRAME
        ========================================================= */

        #contentFrame {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            border: none;
            background: #000;

            z-index: 1;
        }

        /* =========================================================
           GLITCH OVERLAY
           
           IMPORTANT:
           pointer-events: none prevents this overlay from
           blocking the iframe underneath it.
        ========================================================= */

        #staticOverlay {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            pointer-events: none;

            background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACpDid1AAAAIElEQVQIW2P8//8/A8GkQBQoowj6gM0E4rIAAIQABGgAFJBAwAAAAABJRU5ErkJggg==");
            background-size: 2px 2px;

            animation: glitch 1s infinite linear alternate-reverse;

            z-index: 100;

            opacity: 0.9;

            display: block;
        }

        @keyframes glitch {
            0% {
                transform: translate(0, 0);
            }

            5% {
                transform: translate(-2px, -2px);
            }

            10% {
                transform: translate(2px, 2px);
            }

            15% {
                transform: translate(-2px, 2px);
            }

            20% {
                transform: translate(2px, -2px);
            }

            25% {
                transform: translate(0, 0);
            }

            30% {
                background-position: -3px 0;
            }

            40% {
                background-position: 0 -3px;
            }

            50% {
                background-position: -3px -3px;
            }

            60% {
                background-position: 3px 3px;
            }

            70% {
                background-position: -3px 3px;
            }

            80% {
                background-position: 3px -3px;
            }

            90% {
                background-position: 0 0;
            }

            100% {
                transform: translate(0, 0);
                background-position: 0 0;
            }
        }

        /* =========================================================
           CUSTOM CURSOR
        ========================================================= */

        #customCursor {
            position: fixed;

            left: 0;
            top: 0;

            width: 36px;
            height: 42px;

            pointer-events: none;

            z-index: 999999;

            transform:
                translate3d(-100px, -100px, 0);

            opacity: 0;

            will-change: transform;

            transition:
                opacity 0.12s ease;
        }

        /* =========================================================
           WINDOWS 11 STYLE ARROW
        ========================================================= */

        .cursor-outline,
        .cursor-fill {
            position: absolute;

            left: 0;
            top: 0;

            width: 30px;
            height: 38px;

            transform-origin: 0 0;

            clip-path: polygon(
                0 0,
                0 30px,
                8px 24px,
                14px 38px,
                20px 35px,
                14px 22px,
                28px 22px
            );

            transition:
                transform 0.12s ease,
                filter 0.12s ease;
        }

        /* Black outside silhouette */

        .cursor-outline {
            background: #000;

            transform:
                translate(0, 0)
                scale(1.14);

            filter:
                drop-shadow(0 1px 2px rgba(0, 0, 0, 0.9))
                drop-shadow(0 0 2px rgba(0, 0, 0, 0.9));
        }

        /* Green inside */

        .cursor-fill {
            background: #39ff14;

            transform:
                translate(1px, 1px)
                scale(1);

            filter:
                drop-shadow(0 0 4px rgba(57, 255, 20, 0.35));
        }

        /* =========================================================
           HOVER STATE
        ========================================================= */

        #customCursor.hover .cursor-outline {
            transform:
                translate(0, 0)
                scale(1.2);

            filter:
                drop-shadow(0 1px 3px rgba(0, 0, 0, 1))
                drop-shadow(0 0 5px rgba(0, 0, 0, 0.95));
        }

        #customCursor.hover .cursor-fill {
            transform:
                translate(1px, 1px)
                scale(1.05);

            filter:
                drop-shadow(0 0 7px rgba(57, 255, 20, 0.65));
        }

        /* =========================================================
           CLICK STATE
        ========================================================= */

        #customCursor.click .cursor-outline {
            transform:
                translate(1px, 1px)
                scale(0.9);
        }

        #customCursor.click .cursor-fill {
            transform:
                translate(2px, 2px)
                scale(0.82);
        }

        /* =========================================================
           CLICK RING
        ========================================================= */

        .click-ring {
            position: absolute;

            left: 7px;
            top: 7px;

            width: 13px;
            height: 13px;

            border: 2px solid #39ff14;

            border-radius: 50%;

            opacity: 0;

            pointer-events: none;

            transform: scale(1);
        }

        #customCursor.click .click-ring {
            animation: clickExpand 0.3s ease-out;
        }

        @keyframes clickExpand {
            0% {
                width: 13px;
                height: 13px;

                opacity: 0.95;

                transform: scale(1);
            }

            100% {
                width: 48px;
                height: 48px;

                opacity: 0;

                transform: scale(1.2);
            }
        }

        /* =========================================================
           TOUCH DEVICES
        ========================================================= */

        @media (hover: none) and (pointer: coarse) {
            html,
            body,
            body * {
                cursor: auto !important;
            }

            #customCursor {
                display: none;
            }

            #staticOverlay {
                pointer-events: none;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================================
         MAIN SITE
    ========================================================= -->

    <iframe
        id="contentFrame"
        src="https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/logo.svg#/"
        allowfullscreen>
    </iframe>

    <!-- =========================================================
         VISUAL OVERLAY
         DOES NOT BLOCK THE SITE
    ========================================================= -->

    <div id="staticOverlay"></div>

    <!-- =========================================================
         CUSTOM WINDOWS 11 STYLE CURSOR
    ========================================================= -->

    <div id="customCursor">

        <div class="cursor-outline"></div>

        <div class="cursor-fill"></div>

        <div class="click-ring"></div>

    </div>

    <script>
        (() => {
            "use strict";

            const cursor = document.getElementById("customCursor");
            const iframe = document.getElementById("contentFrame");

            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;

            let cursorX = mouseX;
            let cursorY = mouseY;

            let mouseActive = false;
            let hoverState = false;

            const SMOOTHNESS = 0.28;

            /* =====================================================
               CURSOR ANIMATION
            ===================================================== */

            function updateCursor() {
                cursorX += (mouseX - cursorX) * SMOOTHNESS;
                cursorY += (mouseY - cursorY) * SMOOTHNESS;

                cursor.style.transform =
                    `translate3d(${cursorX}px, ${cursorY}px, 0)`;

                requestAnimationFrame(updateCursor);
            }

            updateCursor();

            /* =====================================================
               MOUSE MOVE
            ===================================================== */

            document.addEventListener("mousemove", (event) => {
                mouseX = event.clientX;
                mouseY = event.clientY;

                if (!mouseActive) {
                    mouseActive = true;

                    cursorX = mouseX;
                    cursorY = mouseY;

                    cursor.style.opacity = "1";
                }
            });

            /* =====================================================
               MOUSE ENTER
            ===================================================== */

            document.addEventListener("mouseenter", () => {
                mouseActive = true;
                cursor.style.opacity = "1";
            });

            /* =====================================================
               MOUSE LEAVE
            ===================================================== */

            document.addEventListener("mouseleave", () => {
                mouseActive = false;

                cursor.style.opacity = "0";

                cursor.classList.remove("hover");
                cursor.classList.remove("click");

                hoverState = false;
            });

            /* =====================================================
               CLICKABLE DETECTION
            ===================================================== */

            function isClickable(element) {
                if (!(element instanceof HTMLElement)) {
                    return false;
                }

                if (
                    element.tagName === "A" ||
                    element.tagName === "BUTTON" ||
                    element.tagName === "INPUT" ||
                    element.tagName === "TEXTAREA" ||
                    element.tagName === "SELECT" ||
                    element.tagName === "OPTION"
                ) {
                    return true;
                }

                if (element.hasAttribute("onclick")) {
                    return true;
                }

                if (element.closest("a")) {
                    return true;
                }

                if (element.closest("button")) {
                    return true;
                }

                if (element.closest("[role='button']")) {
                    return true;
                }

                if (element.closest("[data-clickable]")) {
                    return true;
                }

                return false;
            }

            /* =====================================================
               HOVER DETECTION
            ===================================================== */

            document.addEventListener("mouseover", (event) => {
                const target = event.target;

                if (isClickable(target)) {
                    if (!hoverState) {
                        hoverState = true;
                        cursor.classList.add("hover");
                    }
                }
            });

            document.addEventListener("mouseout", (event) => {
                const target = event.target;
                const related = event.relatedTarget;

                if (
                    !related ||
                    !(related instanceof HTMLElement) ||
                    !isClickable(related)
                ) {
                    if (isClickable(target)) {
                        hoverState = false;
                        cursor.classList.remove("hover");
                    }
                }
            });

            /* =====================================================
               LEFT CLICK
            ===================================================== */

            document.addEventListener("mousedown", (event) => {
                if (event.button !== 0) {
                    return;
                }

                cursor.classList.add("click");

                const ring = cursor.querySelector(".click-ring");

                if (ring) {
                    ring.style.animation = "none";

                    void ring.offsetWidth;

                    ring.style.animation =
                        "clickExpand 0.3s ease-out";
                }
            });

            /* =====================================================
               RELEASE CLICK
            ===================================================== */

            document.addEventListener("mouseup", (event) => {
                if (event.button !== 0) {
                    return;
                }

                cursor.classList.remove("click");
            });

            /* =====================================================
               CANCEL CLICK
            ===================================================== */

            document.addEventListener("blur", () => {
                cursor.classList.remove("click");
                cursor.classList.remove("hover");
                hoverState = false;
            });

            window.addEventListener("blur", () => {
                cursor.classList.remove("click");
                cursor.classList.remove("hover");
                hoverState = false;
            });

            /* =====================================================
               TAB FOCUS
            ===================================================== */

            document.addEventListener("keydown", (event) => {
                if (event.key === "Tab") {
                    cursor.style.opacity = "0";
                }
            });

            /* =====================================================
               SHOW AGAIN AFTER MOUSE MOVES
            ===================================================== */

            document.addEventListener("mousemove", () => {
                if (mouseActive) {
                    cursor.style.opacity = "1";
                }
            });

            /* =====================================================
               IFRAME SAFETY
               
               Keep the iframe fully interactive.
               The overlay never receives pointer events.
            ===================================================== */

            iframe.addEventListener("load", () => {
                iframe.style.pointerEvents = "auto";
            });

        })();
    </script>

</body>
</html>
