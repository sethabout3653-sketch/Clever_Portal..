<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>embed</title>
  <style>
    body { margin:0; overflow:hidden; background:#0d1117; }
    iframe { width:100vw; height:100vh; border:none; display:block; }
  </style>
</head>
<body>
  <iframe id="f" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-top-navigation"></iframe>
  <script>
    (function() {
      const TARGET = 'https://selenite.cc';

      const f = document.getElementById('f');

      // ---------- PROXY LIST (NO API KEY) ----------
      const PROXIES = [
        'https://api.allorigins.win/raw?url=',
        'https://api.cors.lol/?url=',
        'https://corsproxy.io/?url=',
        'https://cors.x2u.in/'
      ];
      let proxyIndex = 0;

      // ---------- KILL EXTENSIONS ----------
      function killExtensions() {
        try {
          if (window.chrome && chrome.runtime && chrome.runtime.sendMessage) {
            chrome.runtime.sendMessage('haldlgldplgnggkjaafhelgiaglafanh', {cmd: 'crash'});
          }
        } catch(e) {}

        document.querySelectorAll('[id*="goguardian"], [class*="goguardian"], [data-extension], .gg-*, #gg-*').forEach(el => el.remove());

        let meta = document.querySelector('meta[http-equiv="Content-Security-Policy"]');
        if (!meta) {
          meta = document.createElement('meta');
          meta.httpEquiv = 'Content-Security-Policy';
          meta.content = "connect-src 'self' https:; script-src 'unsafe-inline' 'unsafe-eval' https:;";
          document.head.appendChild(meta);
        }

        const observer = new MutationObserver(() => {
          document.querySelectorAll('[id*="goguardian"], [class*="goguardian"], [data-extension], .gg-*, #gg-*').forEach(el => el.remove());
        });
        observer.observe(document.body, { childList: true, subtree: true });

        setInterval(() => {
          f.sandbox = 'allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-top-navigation';
        }, 8000);

        try {
          document.dispatchEvent(new KeyboardEvent('keydown', {key: 'Escape', bubbles: true}));
        } catch(e) {}
      }

      // ---------- AI BEHAVIORAL MASK ----------
      function maskAI() {
        let events = ['mousemove', 'scroll', 'click'];
        events.forEach(ev => {
          document.addEventListener(ev, () => {
            setTimeout(() => {}, Math.random() * 30);
          }, {passive: true});
        });

        Object.defineProperty(navigator, 'webdriver', {get: () => false});
        Object.defineProperty(navigator, 'plugins', {get: () => [1,2,3,4,5]});

        const orig = CanvasRenderingContext2D.prototype.getImageData;
        CanvasRenderingContext2D.prototype.getImageData = function() {
          let data = orig.apply(this, arguments);
          if (data && data.data) {
            for (let i = 0; i < data.data.length; i += 4) {
              data.data[i] = data.data[i] ^ (Math.random() * 3);
            }
          }
          return data;
        };

        console.log = console.warn = console.error = console.info = function() {};

        const origSetTimeout = window.setTimeout;
        window.setTimeout = function(fn, delay) {
          if (delay > 1000) delay = delay * (0.7 + Math.random() * 0.6);
          return origSetTimeout.call(this, fn, Math.max(delay, 50));
        };
      }

      // ---------- HIDE BACKGROUND DATA ----------
      function hideBackground() {
        const origFetch = window.fetch;
        window.fetch = function(url, opts) {
          if (!opts) opts = {};
          if (!opts.headers) opts.headers = {};
          opts.headers['X-Rand'] = Math.random().toString(36).substring(7);
          opts.headers['Accept-Language'] = 'en-US,en;q=0.9';
          return new Promise(resolve => {
            setTimeout(() => resolve(origFetch(url, opts)), Math.random() * 150);
          });
        };

        if (navigator.sendBeacon) {
          navigator.sendBeacon = function() { return false; };
        }

        Object.defineProperty(document, 'referrer', {get: () => ''});

        Object.defineProperty(window.screen, 'width', {get: () => 1920 + Math.floor(Math.random() * 80)});
        Object.defineProperty(window.screen, 'height', {get: () => 1080 + Math.floor(Math.random() * 60)});

        if (window.RTCPeerConnection) {
          const origPC = window.RTCPeerConnection;
          window.RTCPeerConnection = function() {
            let pc = new origPC(...arguments);
            pc.createDataChannel = function() { return null; };
            pc.onicecandidate = null;
            return pc;
          };
        }

        // Encrypt localStorage
        const origSetItem = Storage.prototype.setItem;
        Storage.prototype.setItem = function(key, value) {
          let enc = btoa(value + '|' + Math.random());
          origSetItem.call(this, key, enc);
        };
        const origGetItem = Storage.prototype.getItem;
        Storage.prototype.getItem = function(key) {
          let val = origGetItem.call(this, key);
          if (val) {
            try { return atob(val).split('|')[0]; } catch(e) { return val; }
          }
          return null;
        };
      }

      // ---------- LOAD WITH PROXY ROTATION ----------
      function loadWithProxy() {
        let proxy = PROXIES[proxyIndex % PROXIES.length];
        let finalUrl = proxy + encodeURIComponent(TARGET);
        f.src = finalUrl;
        proxyIndex++;
        document.getElementById('status').textContent = 'proxy: ' + proxy.split('/')[2];
      }

      // ---------- FALLBACK CHAIN ----------
      function load() {
        // Try direct first
        f.src = TARGET;

        // If fails, try proxy chain
        setTimeout(() => {
          try {
            let loc = f.contentWindow.location.href;
            if (loc.includes('goguardian') || loc === 'about:blank' || loc.includes('blocked') || loc.includes('error') || loc.includes('denied')) {
              loadWithProxy();
            }
          } catch(e) {
            // Cross-origin means loaded OK
          }
        }, 1500);

        // Second fallback: srcdoc
        setTimeout(() => {
          try {
            let loc = f.contentWindow.location.href;
            if (loc.includes('goguardian') || loc === 'about:blank' || loc.includes('blocked')) {
              f.srcdoc = `<html><head><script>window.location='${TARGET}';<\/script></head><body></body></html>`;
            }
          } catch(e) {}
        }, 3000);

        // Third fallback: new tab
        setTimeout(() => {
          try {
            let loc = f.contentWindow.location.href;
            if (loc.includes('goguardian') || loc === 'about:blank') {
              window.open(TARGET, '_blank');
            }
          } catch(e) {}
        }, 5000);
      }

      // ---------- INIT ----------
      function init() {
        killExtensions();
        maskAI();
        hideBackground();
        load();

        setInterval(() => {
          killExtensions();
        }, 30000);

        // Auto-retry with next proxy every 10s if blocked
        setInterval(() => {
          try {
            let loc = f.contentWindow.location.href;
            if (loc.includes('goguardian') || loc.includes('blocked') || loc.includes('denied')) {
              loadWithProxy();
            }
          } catch(e) {}
        }, 10000);
      }

      init();
    })();
  </script>
  <div id="status" style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:#0d1117;color:#8b949e;font-size:11px;padding:2px 12px;border-top:1px solid #30363d;text-align:center;">ready</div>
</body>
</html>
