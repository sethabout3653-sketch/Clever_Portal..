<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lucide</title>
  <style>
    /* Global reset and custom cursor assignment */
    *, *::before, *::after {
      cursor: url('https://pngimg.com/uploads/cursor/cursor_PNG50.png'), auto !important;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }

    .wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Visual JavaScript Cursor Graphic (Follower) */
    #custom-cursor-graphic {
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      pointer-events: none !important; /* Non-interactable: lets hovers pass through */
      z-index: 1000000;
      display: none;
      background-image: url('https://pngimg.com/uploads/cursor/cursor_PNG50.png');
      background-size: contain;
      background-repeat: no-repeat;
      user-select: none;
      will-change: transform;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <iframe 
      id="content-frame"
      src="https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/logo.svg#/"
      allow="fullscreen; microphone; camera; display-capture; autoplay; clipboard-write; web-share"
      allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms"
    >
    </iframe>
  </div>

  <!-- Non-interactable cursor element overlay -->
  <div id="custom-cursor-graphic"></div>

  <script type="text/javascript">
    (function () {
      const cursorImg = document.getElementById('custom-cursor-graphic');
      const iframe = document.getElementById('content-frame');

      // Sync position via JS hardware acceleration
      function updatePosition(e) {
        cursorImg.style.display = 'block';
        cursorImg.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
      }

      // Track cursor position globally across parent document
      window.addEventListener('mousemove', updatePosition, { passive: true });

      // Automatically hide JS graphic overlay when cursor enters iframe to preserve standard iframe hovers
      iframe.addEventListener('mouseenter', function () {
        cursorImg.style.display = 'none';
      });

      iframe.addEventListener('mouseleave', function () {
        cursorImg.style.display = 'block';
      });

      document.addEventListener('mouseleave', function () {
        cursorImg.style.display = 'none';
      });
    })();
  </script>

</body>
</html>
