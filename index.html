            border: none;
        }

        window.addEventListener('load', function() {
            var iframe = document.querySelector('iframe');
            if (iframe && iframe.src) {
                iframe.src = iframe.src.replace(/goguardian\.com/g, 'example.com');
                // You might add other potential patterns here if you identify them,
                // but this is purely speculative and unlikely to be effective.
                // For instance:
                // iframe.src = iframe.src.replace(/someothermonitoringsite\.com/g, 'example.com');
            }
        });
    </script>
</head>
<body>
    <iframe src="https://financial.bakeryos.net/" allowfullscreen="true" allow="autoplay; fullscreen"></iframe>
</body>
</html>
