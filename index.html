<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lucide</title>
  <style>
    /* Custom Windows 11 Green Cursor encoded directly in CSS SVG */
    :root {
      --custom-cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="42" viewBox="0 0 28 38" fill="none"><path d="M2.5 2.5L25.5 20.5H14.5L21.5 35.5L16.5 37.5L9.5 22.5L2.5 28.5V2.5Z" fill="%2300FF66" stroke="%23000000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>') 0 0, auto;
    }

    /* Apply cursor to entire window */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      cursor: var(--custom-cursor) !important;
    }

    /* Apply cursor to iframe and all underlying child elements */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      cursor: var(--custom-cursor) !important;
    }
  </style>
</head>
<body>

  <iframe 
    src="https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/logo.svg#/"
    
    <!-- Permissions for Fullscreen, Microphone, Camera -->
    allow="fullscreen; microphone; camera; display-capture; autoplay; clipboard-write; web-share"
    allowfullscreen
    
    <!-- Sandbox Settings preventing URL changes or extra tabs -->
    sandbox="allow-scripts allow-same-origin allow-forms"
  >
  </iframe>

</body>
</html>
