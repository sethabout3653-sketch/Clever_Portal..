<!DOCTYPE html>
<html>
<head>
<title>Fullscreen Embedded Website - Focused Evasion</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
        background-color: #000;
    }

    #main-content-iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
        z-index: 1; /* Base layer for the content */
    }

    #static-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none; /* Crucial: allows clicks to pass through to iframe */
        background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACpDid1AAAAIElEQVQIW2P8//8/A8GkQBQoowj6gM0E4rIAAIQABGgAFJBAwAAAAABJRU5ErkJggg=='); /* Tiny repeating black dot pattern */
        background-size: 2px 2px;
        animation: glitch 2s infinite linear alternate-reverse;
        z-index: 100; /* Highest z-index to be on top */
        opacity: 0.6; /* Slightly more opaque for more "glitch" effect */
        display: none; /* Hidden by default */
    }

    @keyframes glitch {
        0% { background-position: 0 0; }
        10% { background-position: -2px 0; }
        20% { background-position: 0 -2px; }
        30% { background-position: -2px -2px; }
        40% { background-position: 0 0; }
        50% { background-position: 2px 2px; }
        60% { background-position: 0 2px; }
        70% { background-position: 2px 0; }
        80% { background-position: 2px 2px; }
        90% { background-position: 0 0; }
        100% { background-position: -2px 0; }
    }
</style>
</head>
<body>

    <div id="static-overlay"></div>
    <iframe id="main-content-iframe" src="https://example.com" allowfullscreen title="Main Content"></iframe>

    <script>
        const targetUrl = "https://example.com";
        let primaryIframe = document.getElementById('main-content-iframe');
        const staticOverlay = document.getElementById('static-overlay');

        // Make the static overlay visible and animate it
        staticOverlay.style.display = 'block';

        // Basic "Anti-Deleado" and Content Restoration
        // This script will continuously check if the primary iframe is still there.
        // If it's gone, it tries to recreate it.
        const restorationInterval = setInterval(() => {
            const currentIframe = document.getElementById('main-content-iframe');
            if (!currentIframe) {
                console.warn("Primary iframe not found. Attempting to restore...");
                // Create a new iframe and set its properties
                const newIframe = document.createElement('iframe');
                newIframe.id = 'main-content-iframe';
                newIframe.className = 'iframe-layer'; // Add class for styling consistency
                newIframe.src = targetUrl;
                newIframe.setAttribute('allowfullscreen', '');
                newIframe.title = "Main Content";
                newIframe.style.position = 'absolute';
                newIframe.style.top = '0';
                newIframe.style.left = '0';
                newIframe.style.width = '100%';
                newIframe.style.height = '100%';
                newIframe.style.border = 'none';
                newIframe.style.zIndex = '1'; // Ensure it's behind the overlay

                // Re-attach the error/load listeners if you had them, or just append
                newIframe.onerror = () => console.log(`Error loading restored iframe: ${targetUrl}`);
                newIframe.onload = () => console.log(`Restored iframe loaded: ${targetUrl}`);

                document.body.appendChild(newIframe);
                primaryIframe = newIframe; // Update our reference
            }
            // Additional check: Ensure the static overlay is still visible
            if (staticOverlay.style.display === 'none') {
                console.warn("Static overlay not visible. Restoring...");
                staticOverlay.style.display = 'block';
            }
        }, 3000); // Check every 3 seconds

        // Optional: Force reload on specific browser actions (highly intrusive and often blocked)
        // window.addEventListener('beforeunload', (e) => {
        //     e.preventDefault();
        //     e.returnValue = ''; // This part is largely ignored by modern browsers for security reasons
        //     // In some very specific, older contexts, this might trigger a prompt,
        //     // but it won't prevent navigation/closing.
        // });

        // Optional: Make it harder to right-click and inspect
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault(); // Disable right-click context menu
            // Optionally, show a message or re-trigger the static effect
            staticOverlay.style.opacity = 1; // Temporarily make static solid
            setTimeout(() => { staticOverlay.style.opacity = 0.6; }, 200); // Fade back
        });

        // More aggressive "anti-deleado": try to prevent deletion via DOM manipulation directly
        // This is also easily bypassed by developers.
        const originalAppendChild = document.body.appendChild;
        document.body.appendChild = function(element) {
            if (element.tagName === 'IFRAME' && element.id === 'main-content-iframe') {
                console.log("Intercepted iframe append. Ensuring it's the main one.");
                // If it's the main one being added, just append it normally.
                // If it's some other iframe, we might decide to block it.
                // For this script, we only care about the primary iframe.
                return originalAppendChild.call(this, element);
            } else if (element.tagName === 'IFRAME' && !element.id) {
                 console.warn("Attempt to add an unauthorized iframe blocked.");
                 // Optionally, show the static overlay again or trigger an alert
                 return; // Block the addition of other iframes
            }
            // Append all other elements normally
            return originalAppendChild.call(this, element);
        };

        // If you want to try and prevent the page from being navigated away from
        // by the user clicking links *inside* the iframe (this is tricky as it
        // interferes with normal iframe functionality).
        document.getElementById('main-content-iframe').addEventListener('load', function() {
            try {
                const iframeDoc = this.contentWindow.document;
                if (iframeDoc) {
                    iframeDoc.addEventListener('click', (e) => {
                        // If a link is clicked, this event is captured here.
                        // It's hard to *prevent* the navigation reliably without
                        // breaking the iframe. A common, albeit crude, trick
                        // is to force a reload of the parent page or re-open
                        // the iframe.
                        // For now, we'll just log it as an interception.
                        console.log("Link clicked inside iframe. Parent page might be reloaded.");
                        // Example of forcing a reload (commented out as it's very aggressive)
                        // setTimeout(() => {
                        //     window.location.reload();
                        // }, 100);
                    });
                }
            } catch (e) {
                // Cross-origin restrictions will prevent accessing iframe document
                // console.warn("Could not access iframe document (likely cross-origin):", e);
            }
        });

    </script>

</body>
</html>
