<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clever Loader</title>

<style>
:root{
    --bg: #ffffff;

    --clever-width: 260px;
    --clever-up: 110px;

    --book-width: 200px;
    --book-down: 50px;
}

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body{
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.loader{
    position: relative;
    width: 100%;
    height: 100%;
}

.logo{
    position: absolute;
    top: 50%;
    left: 50%;
    width: var(--clever-width);
    height: auto;
    display: block;
    transform: translate(-50%, -50%) translateY(calc(var(--clever-up) * -1));
}

.book{
    position: absolute;
    top: 50%;
    left: 50%;
    width: var(--book-width);
    height: auto;
    display: block;
    transform: translate(-50%, -50%) translateY(var(--book-down));
}
</style>
</head>
<body>

<div class="loader">
    <img src="book.svg" class="book" alt="Book" />
    <img src="Clever.svg" class="logo" alt="Clever" />
</div>

</body>
</html>
