<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lucide</title>
  <style>
    /* Reset margins and make the body fill the viewport */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      /* Apply custom cursor to the document (hotspot set at top-left 0 0) */
      cursor: url('https://pngimg.com/uploads/cursor/cursor_PNG50.png'), auto;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      cursor: url('https://pngimg.com/uploads/cursor/cursor_PNG50.png'), auto;
    }

    /* Floating custom cursor tracker for cross-iframe visibility */
    #custom-cursor-follower {
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      pointer-events: none; /* Allows clicks to pass through directly to the iframe */
      background-image: url('https://pngimg.com/uploads/cursor/cursor_PNG50.png');
      background-size: contain;
      background-repeat: no-repeat;
      z-index: 999999;
      transform: translate(0, 0);
      display: none;
    }
  </style>
</head>
<body>

  <!-- Custom Cursor Overlay Image -->
  <div id="custom-cursor-follower"></div>

  <iframe 
    src="https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/logo.svg#/"
    
    <!-- Feature Policy / Permissions -->
    allow="fullscreen; microphone; camera; display-capture; autoplay; clipboard-write; web-share"
    allowfullscreen
    
    <!-- Security Sandbox Constraints -->
    sandbox="allow-scripts allow-same-origin allow-forms"
  >
  </iframe>

  <script>
    const follower = document.getElementById('custom-cursor-follower');

    // Track mouse movement across the document
    window.addEventListener('mousemove', (e) => {
      follower.style.display = 'block';
      follower.style.left = `${e.clientX}px`;
      follower.style.top = `${e.clientY}px`;
    });

    // Hide custom follower if the pointer leaves the screen
    document.addEventListener('mouseleave', () => {
      follower.style.display = 'none';
    });
  </script>

</body>
</html>
