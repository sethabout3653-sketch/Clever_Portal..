<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lucide</title>
  <style>
    /* Reset margins and set cursor styling across parent and elements */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      cursor: url('https://pngimg.com/uploads/cursor/cursor_PNG50.png'), auto !important;
    }

    .app-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      cursor: url('https://pngimg.com/uploads/cursor/cursor_PNG50.png'), auto !important;
    }

    /* Invisible overlay layer to capture mouse movements over cross-origin iframe */
    #cursor-tracker-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 99999;
      background: rgba(0, 0, 0, 0);
      cursor: url('https://pngimg.com/uploads/cursor/cursor_PNG50.png'), auto !important;
    }

    /* JavaScript Visual Cursor Element */
    #js-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      pointer-events: none; /* Allows pointer pass-through */
      z-index: 1000000;
      display: none;
      background-image: url('https://pngimg.com/uploads/cursor/cursor_PNG50.png');
      background-size: contain;
      background-repeat: no-repeat;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- Active pointer tracking layer -->
    <div id="cursor-tracker-overlay"></div>

    <iframe 
      id="content-frame"
      src="https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/logo.svg#/"
      allow="fullscreen; microphone; camera; display-capture; autoplay; clipboard-write; web-share"
      allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms"
    >
    </iframe>
  </div>

  <!-- JS Custom Cursor Object -->
  <div id="js-cursor"></div>

  <!-- Inline JavaScript Execution -->
  <script type="text/javascript">
    (function () {
      const customCursor = document.getElementById('js-cursor');
      const overlay = document.getElementById('cursor-tracker-overlay');
      const iframe = document.getElementById('content-frame');

      let isInteracting = false;

      // Update cursor position directly via JS DOM transform
      function moveCursor(e) {
        customCursor.style.display = 'block';
        customCursor.style.transform = `translate3d(${e.clientX}px, ${e.clientY}px, 0)`;
      }

      // Track pointer across the overlay
      overlay.addEventListener('mousemove', moveCursor);
      overlay.addEventListener('pointermove', moveCursor);

      // Handle clicks: pass pointer focus through overlay to iframe
      overlay.addEventListener('mousedown', function (e) {
        // Temporarily disable overlay so click reaches the iframe target
        overlay.style.pointerEvents = 'none';
        customCursor.style.display = 'block';

        // Re-enable tracking overlay immediately after click event registers
        setTimeout(function () {
          overlay.style.pointerEvents = 'auto';
        }, 150);
      });

      // Hide cursor element when mouse exits browser viewport
      document.addEventListener('mouseleave', function () {
        customCursor.style.display = 'none';
      });

      // Maintain mouse tracker when window regains focus
      window.addEventListener('focus', function () {
        overlay.style.pointerEvents = 'auto';
      });
    })();
  </script>

</body>
</html>
