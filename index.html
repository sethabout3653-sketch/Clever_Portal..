<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clever | Loading</title>
    <link rel="icon" type="image/png" href="poop.png" />
    <style>
        :root {
            --bg: #ffffff;
            --clever-width: 290px;
            --clever-up: 95px;
            --book-width: 250px;
            --book-down: 5px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }
        .loader, .site {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .loader {
            background: var(--bg);
            z-index: 2;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            opacity: 1;
            visibility: visible;
        }
        .loader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .logo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: var(--clever-width);
            height: auto;
            display: block;
            transform: translate(-50%, -50%) translateY(calc(var(--clever-up) * -1));
            user-select: none;
            -webkit-user-drag: none;
        }
        .book {
            position: absolute;
            top: 50%;
            left: 50%;
            width: var(--book-width);
            height: auto;
            display: block;
            transform: translate(-50%, -50%) translateY(var(--book-down));
            user-select: none;
            -webkit-user-drag: none;
        }
        .site {
            z-index: 1;
            border: none;
            width: 100%;
            height: 100%;
            display: block;
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <img src="book.svg" class="book" alt="Book" />
        <img src="Clever.svg" class="logo" alt="Clever" />
    </div>
    <iframe class="site" id="siteFrame" src="about:blank" data-src="https://ual.beltfrog.com/" allowfullscreen title="Clever Portal"></iframe>
    <script>
        (function () {
            const loader = document.getElementById('loader');
            const siteFrame = document.getElementById('siteFrame');
            const _delay1 = Math.floor(Math.random() * 2001) + 1000; // 1-3 seconds for loader hide
            const _delay2 = Math.floor(Math.random() * 4001) + 3000; // 3-7 seconds for site load

            document.title = "Clever | Loading";

            // --- Tab Close/Leave Protection ---
            let _unsaved = true;
            function _handleUnload(e) {
                if (!_unsaved) return;
                const msg = 'Changes you made may not be saved.';
                e.preventDefault();
                e.returnValue = msg;
                return msg;
            }
            window.addEventListener('beforeunload', _handleUnload);
            window.setUnsavedChanges = function (value) {
                _unsaved = Boolean(value);
            };

            // --- Obfuscation & Interaction Fixes ---

            // Prevent right-click, F12, Ctrl+Shift+I, Ctrl+U
            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
                    e.preventDefault();
                }
            });

            // Disable text selection for harder inspection
            document.body.style.userSelect = document.body.style.webkitUserSelect = document.body.style.msUserSelect = document.body.style.mozUserSelect = 'none';

            // Use a more permissive sandbox for the iframe to ensure functionality
            // but still restrict some potentially harmful actions.
            // The 'allow' attribute ensures specific features are enabled.
            siteFrame.setAttribute('sandbox', 'allow-forms allow-scripts allow-same-origin allow-popups allow-modals allow-downloads');
            siteFrame.setAttribute('allow', 'autoplay; camera; microphone; geolocation; encrypted-media; display-capture; clipboard-write; web-share;');
            siteFrame.setAttribute('referrerpolicy', 'no-referrer'); // Keep this for privacy/obfuscation

            // --- Load Site Content ---
            window.addEventListener('load', () => {
                setTimeout(() => {
                    const realSrc = siteFrame.getAttribute('data-src');
                    if (realSrc) {
                        siteFrame.src = realSrc;
                    }
                }, _delay2);
            });

            // --- Iframe Load and Post-Load Actions ---
            siteFrame.addEventListener('load', () => {
                // Attempt to modify iframe content for obfuscation
                try {
                    const iframeDoc = siteFrame.contentWindow.document;
                    // Remove potentially revealing elements/attributes
                    const elementsToModify = iframeDoc.querySelectorAll('a, form, link[rel="canonical"], meta[name="robots"], meta[name="googlebot"]');
                    elementsToModify.forEach(el => {
                        el.removeAttribute('referrerpolicy');
                        el.removeAttribute('rel'); // Remove canonical if present
                        if (el.tagName === 'META') el.remove(); // Remove meta tags entirely
                    });

                    // Add a small delay before hiding loader to ensure iframe is ready
                    setTimeout(() => {
                        loader.classList.add('hide');
                        document.title = "Clever | Portal";
                    }, _delay1);

                } catch (e) {
                    // If cross-origin prevents access, still hide the loader after its delay
                    console.warn("Could not fully access iframe content for modification:", e);
                    setTimeout(() => {
                        loader.classList.add('hide');
                        document.title = "Clever | Portal";
                    }, _delay1);
                }
            });

            // --- Self-Destructing Script (Optional, for extreme cases) ---
            // This makes it harder to grab the script if the page is left open
            // but might interfere with dynamic content loading if not handled carefully.
            // For now, we'll keep the script accessible but obfuscated.

        })();
    </script>
</body>
</html>
