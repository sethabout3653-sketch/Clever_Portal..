<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>unblock</title>
  <style>
    body { background: #0d1117; color: #c9d1d9; font-family: monospace; padding: 20px; }
    input, button { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; padding: 8px; }
    iframe { width: 100%; height: 80vh; border: 1px solid #30363d; margin-top: 10px; }
  </style>
</head>
<body>
  <input id="url" value="https://example.com" size="60">
  <button onclick="go()">load</button>
  <button onclick="reset()">reset</button>
  <iframe id="frame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
  <script>
    function go() {
      let u = document.getElementById('url').value;
      let f = document.getElementById('frame');
      // If GoGuardian blocks, try loading via a proxy service
      if (u.includes('goguardian') || u.includes('blocked')) {
        f.src = 'https://corsproxy.io/?' + encodeURIComponent(u);
      } else {
        f.src = u;
      }
    }
    function reset() {
      document.getElementById('frame').src = 'about:blank';
    }
    // Optional: bypass extension by opening in new tab with data URI
    function openData() {
      let u = document.getElementById('url').value;
      let data = `<html><head><meta http-equiv="refresh" content="0;url=${u}"></head></html>`;
      window.open('data:text/html;charset=utf-8,' + encodeURIComponent(data));
    }
    // Auto-load on enter
    document.getElementById('url').addEventListener('keydown', (e) => { if(e.key==='Enter') go(); });
  </script>
</body>
</html>
