<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clever | Loading</title>
<link rel="icon" type="image/png" href="poop.png" />
<style>
:root {
    --bg: #ffffff;
    --clever-width: 290px;
    --clever-up: 95px;
    --book-width: 250px;
    --book-down: 5px;
    --transition-speed: 0.6s;
    --z-loader: 2;
    --z-site: 1;
}
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Courier New', Courier, monospace; /* Changed font for readability reduction */
    color: #0f0; /* Green text for a terminal-like feel */
    background-color: #000; /* Black background */
}
.loader, .site {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}
.loader {
    background: #000; /* Black background for loader */
    z-index: var(--z-loader);
    opacity: 1;
    visibility: visible;
    transition: opacity var(--transition-speed) ease, visibility var(--transition-speed) ease;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-shadow: 0 0 5px #0f0, 0 0 10px #0f0, 0 0 15px #0f0; /* Glitchy text effect */
}
.loader.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}
.logo {
    width: var(--clever-width);
    height: auto;
    display: block;
    margin-bottom: calc(var(--clever-up) * 1.5);
    user-select: none;
    -webkit-user-drag: none;
    filter: hue-rotate(90deg) brightness(1.5) contrast(1.2); /* Obfuscated filter */
    animation: glitch 1s infinite steps(1); /* Glitch animation */
}
.book {
    width: var(--book-width);
    height: auto;
    display: block;
    margin-top: var(--book-down);
    user-select: none;
    -webkit-user-drag: none;
    opacity: 0.6;
    animation: scanlines 5s linear infinite, rotate 6s linear infinite; /* Added scanlines animation */
}
.site {
    z-index: var(--z-site);
    border: none;
    width: 100%;
    height: 100%;
    display: block;
    background: #111; /* Darker background for iframe */
    box-shadow: inset 0 0 20px rgba(0, 255, 0, 0.3), 0 0 15px rgba(0, 255, 0, 0.5); /* Neon green glow */
}
@keyframes glitch {
    0% { transform: translate(0); }
    10% { transform: translate(-5px, 5px); }
    20% { transform: translate(5px, -5px); }
    30% { transform: translate(-5px, 5px); }
    40% { transform: translate(5px, -5px); }
    50% { transform: translate(0); }
    60% { transform: translate(-3px, 3px); }
    70% { transform: translate(3px, -3px); }
    80% { transform: translate(-3px, 3px); }
    90% { transform: translate(3px, -3px); }
    100% { transform: translate(0); }
}
@keyframes scanlines {
    0% { background-position: 0 0; }
    100% { background-position: 0 100%; }
}
</style>
</head>
<body>
<div class="loader" id="loader">
<img src="book.svg" class="book" alt="Book" />
<img src="Clever.svg" class="logo" alt="Clever" />
</div>
<iframe class="site" id="siteFrame" src="about:blank" data-src="https://sneakers-otoole.lervs.ro/" allowfullscreen title="Clever Portal"></iframe>
<script>
(function() {
    const ldr = document.getElementById('loader');
    const sfr = document.getElementById('siteFrame');
    const d1 = Math.floor(Math.random() * 2001) + 1000;
    const d2 = Math.floor(Math.random() * 4001) + 3000;

    document.title = "\x43\x6c\x65\x76\x65\x72 | \x4c\x6f\x61\x64\x69\x6e\x67..."; // Unicode obfuscation for title

    let uc = true;

    function ulh(e) {
        if (!uc) return;
        const msg = '\x43\x68\x61\x6e\x67\x65\x73 \x79\x6f\x75\x20\x6d\x61\x64\x65 \x6d\x61\x79 \x6e\x6f\x74 \x62\x65 \x73\x61\x76\x65\x64.';
        e.preventDefault();
        e.returnValue = msg;
        return msg;
    }
    window.addEventListener('beforeunload', ulh);
    window.setUnsavedChanges = function(v) { uc = Boolean(v); };

    document.addEventListener('contextmenu', e => e.preventDefault());

    document.addEventListener('keydown', e => {
        if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
            e.preventDefault();
        }
    });

    document.body.style.userSelect = document.body.style.webkitUserSelect = document.body.style.msUserSelect = document.body.style.mozUserSelect = 'none';

    sfr.setAttribute('sandbox', 'allow-forms allow-scripts allow-same-origin allow-popups allow-modals allow-downloads allow-pointer-lock allow-top-navigation-by-user-activation');
    sfr.setAttribute('allow', 'autoplay; camera; microphone; geolocation; encrypted-media; display-capture; clipboard-write; web-share; xr-spatial-tracking;');
    sfr.setAttribute('referrerpolicy', 'unsafe-url'); // More permissive, but can be changed if needed

    window.addEventListener('load', () => {
        setTimeout(() => {
            const srcAttr = sfr.getAttribute('data-src');
            if (srcAttr) sfr.src = srcAttr;
        }, d2);
    });

    sfr.addEventListener('load', () => {
        try {
            const idoc = sfr.contentWindow.document;
            const els = idoc.querySelectorAll('a, form, link[rel="canonical"], meta[name="robots"], meta[name="googlebot"], script, iframe, object, embed, applet, base');
            els.forEach(el => {
                el.removeAttribute('referrerpolicy');
                el.removeAttribute('rel');
                if (el.tagName === 'META' && (el.getAttribute('name') === 'robots' || el.getAttribute('name') === 'googlebot')) el.remove();
                if (el.tagName === 'SCRIPT' || el.tagName === 'IFRAME' || el.tagName === 'OBJECT' || el.tagName === 'EMBED' || el.tagName === 'APPLET') el.remove();
                if (el.tagName === 'A') el.removeAttribute('href');
                if (el.tagName === 'FORM') el.removeAttribute('action');
                if (el.tagName === 'BASE') el.remove(); // Remove base tag
            });

            // Attempt to disable right-click within the iframe
            idoc.addEventListener('contextmenu', e => e.preventDefault());
            idoc.addEventListener('keydown', e => {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
                    e.preventDefault();
                }
            });
             // Further obfuscation: try to remove specific JS properties if possible, though highly unreliable and browser-dependent
            if (sfr.contentWindow.localStorage) {
                sfr.contentWindow.localStorage.clear();
            }
             if (sfr.contentWindow.sessionStorage) {
                sfr.contentWindow.sessionStorage.clear();
            }


        } catch (e) {
            // console.warn("iframe access restricted:", e);
        } finally {
            setTimeout(() => {
                ldr.classList.add('hide');
                document.title = "\x43\x6c\x65\x76\x65\x72 | \x50\x6f\x72\x74\x61\x6c"; // Unicode obfuscation
            }, d1);
        }
    });
})();
</script>
</body>
</html>
