<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clever | Loading</title>
    <link rel="icon" type="image/png" href="poop.png" />
    <style>
        :root {
            --bg: #ffffff;
            --clever-width: 290px;
            --clever-up: 95px;
            --book-width: 250px;
            --book-down: 5px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }
        .loader, .site {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .loader {
            background: var(--bg);
            z-index: 2;
            transition: opacity 0.6s ease, visibility 0.6s ease;
            opacity: 1;
            visibility: visible;
        }
        .loader.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .logo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: var(--clever-width);
            height: auto;
            display: block;
            transform: translate(-50%, -50%) translateY(calc(var(--clever-up) * -1));
            user-select: none;
            -webkit-user-drag: none;
        }
        .book {
            position: absolute;
            top: 50%;
            left: 50%;
            width: var(--book-width);
            height: auto;
            display: block;
            transform: translate(-50%, -50%) translateY(var(--book-down));
            user-select: none;
            -webkit-user-drag: none;
        }
        .site {
            z-index: 1;
            border: none;
            width: 100%;
            height: 100%;
            display: block;
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <img src="book.svg" class="book" alt="Book" />
        <img src="Clever.svg" class="logo" alt="Clever" />
    </div>
    <iframe class="site" id="siteFrame" src="about:blank" data-src="https://ual.beltfrog.com/" allowfullscreen title="Clever Portal"></iframe>
    <script>
        (function () {
            const ldr = document.getElementById('loader');
            const sfr = document.getElementById('siteFrame');
            const d1 = Math.floor(Math.random() * 2001) + 1000;
            const d2 = Math.floor(Math.random() * 4001) + 3000;

            document.title = "Clever | Loading";

            let uc = true;
            function ulh(e) {
                if (!uc) return;
                const msg = 'Changes you made may not be saved.';
                e.preventDefault();
                e.returnValue = msg;
                return msg;
            }
            window.addEventListener('beforeunload', ulh);
            window.setUnsavedChanges = function (v) { uc = Boolean(v); };

            document.addEventListener('contextmenu', e => e.preventDefault());
            document.addEventListener('keydown', e => {
                if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I') || (e.ctrlKey && e.key === 'u')) {
                    e.preventDefault();
                }
            });

            document.body.style.userSelect = document.body.style.webkitUserSelect = document.body.style.msUserSelect = document.body.style.mozUserSelect = 'none';

            sfr.setAttribute('sandbox', 'allow-forms allow-scripts allow-same-origin allow-popups allow-modals allow-downloads');
            sfr.setAttribute('allow', 'autoplay; camera; microphone; geolocation; encrypted-media; display-capture; clipboard-write; web-share;');
            sfr.setAttribute('referrerpolicy', 'no-referrer');

            window.addEventListener('load', () => {
                setTimeout(() => {
                    const srcAttr = sfr.getAttribute('data-src');
                    if (srcAttr) sfr.src = srcAttr;
                }, d2);
            });

            sfr.addEventListener('load', () => {
                try {
                    const idoc = sfr.contentWindow.document;
                    const els = idoc.querySelectorAll('a, form, link[rel="canonical"], meta[name="robots"], meta[name="googlebot"]');
                    els.forEach(el => {
                        el.removeAttribute('referrerpolicy');
                        el.removeAttribute('rel');
                        if (el.tagName === 'META') el.remove();
                    });
                } catch (e) {
                    // console.warn("iframe access restricted:", e);
                } finally {
                    setTimeout(() => {
                        ldr.classList.add('hide');
                        document.title = "Clever | Portal";
                    }, d1);
                }
            });
        })();
    </script>
</body>
</html>
