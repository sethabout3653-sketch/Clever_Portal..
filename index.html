<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clever Loader</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    background:#ffffff;
    overflow:hidden;
    font-family:Arial, Helvetica, sans-serif;
}

.loader{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:24px;
}

.book{
    width:120px;
    height:auto;
    display:block;
}

.logo{
    width:220px;
    height:auto;
    display:block;
}
</style>
</head>
<body>

<div class="loader">
    <img src="book.svg" class="book" alt="Book">
    <img src="Clever.svg" class="logo" alt="Clever">
</div>

</body>
</html>
