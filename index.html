<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Math & Games and History</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a; /* Slightly lighter dark background for better contrast */
            color: #eee;
            font-family: 'Arial', sans-serif;
            cursor: crosshair; /* Subtle change to suggest interaction */
        }
        #site-frame {
            width: 100%;
            height: 100vh;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background-color: transparent; /* Crucial for overlay blending */
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Minimalist noise filter for performance */
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><defs><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="3" seed="12345" stitchTiles="stitch"/><feColorMatrix in="SourceGraphic" type="matrix" values="0.7 0 0 0 0 0 0.7 0 0 0 0 0 0.7 0 0 0 0 0 1 0"/></filter></defs><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.2"/></svg>');
            background-repeat: repeat;
            opacity: 0.3; /* Reduced opacity to be less intrusive */
            z-index: 2; /* Ensure it's above iframe */
            pointer-events: none; /* Initial state: overlay is non-interactive */
            transition: opacity 0.5s ease-in-out;
        }
        .overlay-active #overlay {
            opacity: 0.0; /* Overlay fades out when active interaction is detected */
            pointer-events: none;
        }
        .overlay-static { /* For static moments */
            opacity: 0.3;
            pointer-events: auto; /* Ensure it can be interacted with if needed */
        }
        #notification {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 10px 20px;
            border-radius: 5px;
            border: 1px solid #00ff00;
            box-shadow: 0 0 10px #00ff00;
            display: none;
            z-index: 10000;
            font-size: 0.9em;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .notification-show { display: block !important; opacity: 1; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="notification">Bypass Engaged</div>
    <iframe id="site-frame" src="https://financial.bakeryos.net/"></iframe>
    <div id="overlay"></div>

    <script>
        (function() {
            const startTime = Date.now();
            let interactionDetected = false;
            let interactionTimeout;
            let notificationTimeout;

            const notificationElement = document.getElementById('notification');
            const overlayElement = document.getElementById('overlay');
            const iframeElement = document.getElementById('site-frame');

            // --- Performance-Optimized Obfuscation ---
            const mockConsole = () => {
                if (window.console) {
                    const noOp = () => {};
                    const methods = ['log', 'warn', 'error', 'info', 'debug', 'trace', 'assert', 'clear', 'count', 'countReset', 'dir', 'dirxml', 'group', 'groupCollapsed', 'groupEnd', 'profile', 'profileEnd', 'table', 'time', 'timeLog', 'timeEnd', 'timeStamp', 'timeline', 'timelineEnd', 'exception'];
                    methods.forEach(method => {
                        try { window.console[method] = noOp; } catch (e) {}
                    });
                }
            };
            mockConsole();

            const blockProperty = (obj, prop, value, writable = false, configurable = false, enumerable = false) => {
                try {
                    Object.defineProperty(obj, prop, {
                        value: value,
                        writable: writable,
                        configurable: configurable,
                        enumerable: enumerable
                    });
                } catch (e) { /* Ignore errors, focus on success */ }
            };

            const mockNavigator = () => {
                blockProperty(navigator, 'webdriver', undefined);
                blockProperty(navigator, 'platform', 'Win32');
                blockProperty(navigator, 'userAgent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36');
                blockProperty(navigator, 'languages', ['en-US', 'en']);
                blockProperty(navigator, 'plugins', []);
                blockProperty(navigator, 'mimeTypes', []);
            };
            mockNavigator();

            // Overriding document properties can be done once
            try {
                Object.defineProperty(document, 'referrer', { get: () => '', configurable: true });
                Object.defineProperty(document, 'domain', { get: () => 'example.com', configurable: true });
            } catch (e) { /* Ignore */ }

            // Mock Page Visibility API directly
            Object.defineProperties(document, {
                'visibilityState': { value: 'visible', configurable: true },
                'hidden': { value: false, configurable: true },
            });

            // Simplified event blocking for performance
            const blockElementEvent = (target, type) => {
                target.addEventListener(type, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, { capture: true }); // Use capture phase for early interception
            };

            blockElementEvent(document, 'contextmenu');
            blockElementEvent(window, 'keydown');
            blockElementEvent(window, 'keyup');
            blockElementEvent(window, 'keypress');

            const blockedLifecycleEvents = ['visibilitychange', 'beforeunload', 'unload', 'pagehide', 'freeze', 'resume', 'blur'];
            blockedLifecycleEvents.forEach(event => blockElementEvent(window, event));

            // API interception with minimal overhead
            const blockApiList = ['goguardian', 'monitoring', 'detection', 'analysis', 'security-check', 'bot-detect'];

            const createWrappedApi = (originalApi, blockList) => {
                return new Proxy(originalApi, {
                    apply: function(target, thisArg, argumentsList) {
                        const url = typeof argumentsList[0] === 'string' ? argumentsList[0] : (argumentsList[1] && argumentsList[1].url);
                        if (typeof url === 'string' && blockList.some(blockUrl => url.includes(blockUrl))) {
                            // console.warn(`Blocked API call to: ${url}`); // Silent by default
                            return Promise.resolve(new Response('{}', { status: 204 }));
                        }
                        return Reflect.apply(target, thisArg, argumentsList);
                    }
                });
            };

            if (window.fetch) {
                window.fetch = createWrappedApi(window.fetch, blockApiList);
            }

            const originalXHR = window.XMLHttpRequest;
            window.XMLHttpRequest = function(args) {
                const xhr = new originalXHR(args);
                const originalOpen = xhr.open;
                xhr.open = function(method, url) {
                    if (blockApiList.some(blockUrl => url.includes(blockUrl))) {
                        // console.warn(`Blocked XHR to: ${url}`);
                        return; // Effectively blocks the call
                    }
                    originalOpen.apply(xhr, arguments);
                };
                return xhr;
            };

            const originalWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
                if (blockApiList.some(blockUrl => url.includes(blockUrl))) {
                    // console.warn(`Blocked WebSocket to: ${url}`);
                    return new originalWebSocket('wss://echo.websocket.org'); // Re-route to a safe echo server
                }
                return new originalWebSocket(url, protocols);
            };

            // --- Performance-Focused Overlay & Interaction ---
            const updateOverlayOpacity = (opacity) => {
                if (overlayElement) {
                    overlayElement.style.opacity = opacity;
                }
            };

            const showNotification = (message, duration = 4000) => {
                if (notificationElement) {
                    notificationElement.textContent = message;
                    notificationElement.classList.add('notification-show');
                    clearTimeout(notificationTimeout);
                    notificationTimeout = setTimeout(() => {
                        notificationElement.classList.remove('notification-show');
                    }, duration);
                }
            };

            const manageOverlayAndInteractions = () => {
                // Fade overlay out on any input event within the body
                document.body.addEventListener('mousemove', handleInteraction, { capture: true });
                document.body.addEventListener('mousedown', handleInteraction, { capture: true });
                document.body.addEventListener('touchstart', handleInteraction, { capture: true });
                document.body.addEventListener('scroll', handleInteraction, { capture: true });

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden === false) { // If becoming visible
                        showNotification('Bypass Active', 2000);
                        if (overlayElement) overlayElement.classList.remove('overlay-static');
                    } else { // If becoming hidden
                        if (overlayElement) overlayElement.classList.add('overlay-static');
                    }
                });

                // Initial state
                if (document.hidden === false) {
                    showNotification('Bypass Engaged', 3000);
                } else {
                    if (overlayElement) overlayElement.classList.add('overlay-static');
                }
            };

            let lastInteractionTime = Date.now();
            const INTERACTION_RESET_TIME = 5000; // milliseconds

            const handleInteraction = (event) => {
                if (!interactionDetected) {
                    interactionDetected = true;
                    if (overlayElement) overlayElement.classList.remove('overlay-static');
                    showNotification('Bypass Active', 2000); // Show brief 'active' notification
                }

                // Reset overlay opacity on interaction
                updateOverlayOpacity(0.0);
                clearTimeout(interactionTimeout);

                // Schedule overlay to become slightly opaque again after a period of no interaction
                interactionTimeout = setTimeout(() => {
                    updateOverlayOpacity(0.3); // Return to subtle static opacity
                    interactionDetected = false; // Allow 'engaged' notification on next true interaction
                    if (overlayElement) overlayElement.classList.add('overlay-static');
                }, INTERACTION_RESET_TIME);
            };

            // --- Initialization ---
            const init = () => {
                mockConsole();
                mockNavigator();
                manageOverlayAndInteractions();

                // Ensure iframe is correctly positioned and loaded
                if (iframeElement) {
                    iframeElement.onload = () => {
                        // console.log("Iframe loaded successfully.");
                        // Additional checks or actions can be added here if needed
                    };
                    iframeElement.onerror = () => {
                        // console.error("Iframe failed to load.");
                        showNotification("Error loading site.", 5000);
                    };
                }

                // Periodic, very lightweight checks (e.g., check if console is still mocked)
                setInterval(() => {
                    mockConsole(); // Re-mock console periodically
                    // More complex checks could be added here if performance allows
                }, 10000); // Every 10 seconds
            };

            // Trigger initialization
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', init);
            } else {
                init(); // DOM is already ready
            }

        })();
    </script>
</body>
</html>
