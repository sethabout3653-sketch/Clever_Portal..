<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Clever | Loading</title>
<link rel="icon" type="image/png" href="poop.png" />

<style>
:root{
    --bg: #ffffff;

    --clever-width: 290px;
    --clever-up: 95px;

    --book-width: 250px;
    --book-down: 5px;
}

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body{
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
}

.loader,
.site{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.loader{
    background: var(--bg);
    z-index: 2;
    transition: opacity 0.6s ease, visibility 0.6s ease;
    opacity: 1;
    visibility: visible;
}

.loader.hide{
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.logo{
    position: absolute;
    top: 50%;
    left: 50%;
    width: var(--clever-width);
    height: auto;
    display: block;
    transform: translate(-50%, -50%) translateY(calc(var(--clever-up) * -1));
    user-select: none;
    -webkit-user-drag: none;
}

.book{
    position: absolute;
    top: 50%;
    left: 50%;
    width: var(--book-width);
    height: auto;
    display: block;
    transform: translate(-50%, -50%) translateY(var(--book-down));
    user-select: none;
    -webkit-user-drag: none;
}

.site{
    z-index: 1;
    border: none;
    width: 100%;
    height: 100%;
    display: block;
    background: #fff;
}
</style>
</head>
<body>

<div class="loader" id="loader">
    <img src="book.svg" class="book" alt="Book" />
    <img src="Clever.svg" class="logo" alt="Clever" />
</div>

<iframe
    class="site"
    id="siteFrame"
    src="about:blank"
    data-src="https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/logo.svg#/"
    allowfullscreen
    referrerpolicy="no-referrer"
    title="Clever Portal">
</iframe>

<script>
(function () {
    const loader = document.getElementById('loader');
    const siteFrame = document.getElementById('siteFrame');
    const delay = Math.floor(Math.random() * 4001) + 3000; // 3000 to 7000 ms

    document.title = "Clever | Loading";

    // Tab close / leave protection
    let unsavedChanges = true;

    function beforeUnloadHandler(e) {
        if (!unsavedChanges) return;
        e.preventDefault();
        e.returnValue = '';
        return '';
    }

    window.addEventListener('beforeunload', beforeUnloadHandler);

    window.addEventListener('load', () => {
        setTimeout(() => {
            const realSrc = siteFrame.getAttribute('data-src');
            if (realSrc) {
                siteFrame.src = realSrc;
            }

            loader.classList.add('hide');
            document.title = "Clever | Portal";
        }, delay);
    });

    window.setUnsavedChanges = function (value) {
        unsavedChanges = Boolean(value);
    };
})();
</script>

</body>
</html>
