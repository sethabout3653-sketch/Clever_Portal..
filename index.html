<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lucide</title>
  <style>
    /* Reset margins and set cursor styling */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      /* Hide the default system cursor */
      cursor: none !important;
    }

    /* Force all elements inside to hide the default cursor */
    *, *::before, *::after {
      cursor: none !important;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      /* Prevent iframe from intercepting mouse events so custom cursor tracks over it */
      pointer-events: auto;
    }

    /* Custom Windows 11 Style Green Cursor Container */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 28px;
      height: 38px;
      pointer-events: none; /* Prevents the custom cursor from blocking clicks */
      z-index: 999999;
      will-change: transform;
      /* Precise transform hotspot alignment */
      transform: translate3d(0, 0, 0);
    }
  </style>
</head>
<body>

  <!-- Custom SVG Cursor with Windows 11 Geometry, Green Fill, & Thick Black Outline -->
  <div id="custom-cursor">
    <svg width="28" height="38" viewBox="0 0 28 38" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path 
        d="M2.5 2.5L25.5 20.5H14.5L21.5 35.5L16.5 37.5L9.5 22.5L2.5 28.5V2.5Z" 
        fill="#00FF66" 
        stroke="#000000" 
        stroke-width="3" 
        stroke-linejoin="round"
        stroke-linecap="round"
      />
    </svg>
  </div>

  <iframe 
    src="https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/logo.svg#/"
    
    <!-- Feature Policy / Permissions -->
    allow="fullscreen; microphone; camera; display-capture; autoplay; clipboard-write; web-share"
    allowfullscreen
    
    <!-- Security Sandbox Constraints -->
    sandbox="allow-scripts allow-same-origin allow-forms"
  >
  </iframe>

  <script>
    const cursor = document.getElementById('custom-cursor');

    // Smooth, zero-lag 1:1 hardware position tracking using requestAnimationFrame
    let mouseX = -100;
    let mouseY = -100;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    }, { passive: true });

    function updateCursorPosition() {
      // Offset slightly to align the exact point of the arrow with the click location
      cursor.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
      requestAnimationFrame(updateCursorPosition);
    }

    // Start tracking loop
    requestAnimationFrame(updateCursorPosition);
  </script>

</body>
</html>
