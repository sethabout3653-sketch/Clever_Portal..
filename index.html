            display: block;

            top: 0;

            align-items: center;

        }
        
        .control-panel {

            right: 20px;
            background-color: rgba(30, 30, 30, 0.8);
            color: white;
            padding: 10px;
            border-radius: 8px;
            z-index: 100;
            display: flex;

            transition: opacity 0.3s;

        .control-button {
            background-color: #444;
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .control-button:hover {

        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }

        }

        }

        :-webkit-full-screen {

        }
        
        :-moz-full-screen {

        }
        
        :-ms-fullscreen {

        }

</head>
