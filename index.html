<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embedded Website</title>
    <script defer src="blockGoGuardian.js"></script>
    <style>
        body, html {
            margin: 0;
