<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gamesfr</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            cursor: none !important;
        }

        body *,
        body *::before,
        body *::after {
            cursor: none !important;
        }

        /* =========================================================
           MAIN IFRAME
        ========================================================= */

        #contentFrame {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: none;

            background: #000;

            z-index: 1;
        }

        /* =========================================================
           GLITCH OVERLAY
        ========================================================= */

        #staticOverlay {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            pointer-events: auto;

            background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACpDid1AAAAIElEQVQIW2P8//8/A8GkQBQoowj6gM0E4rIAAIQABGgAFJBAwAAAAABJRU5ErkJggg==");
            background-size: 2px 2px;

            animation: glitch 1s infinite linear alternate-reverse;

            z-index: 100;

            opacity: 0.9;

            display: block;
        }

        @keyframes glitch {
            0% {
                transform: translate(0, 0);
            }

            5% {
                transform: translate(-2px, -2px);
            }

            10% {
                transform: translate(2px, 2px);
            }

            15% {
                transform: translate(-2px, 2px);
            }

            20% {
                transform: translate(2px, -2px);
            }

            25% {
                transform: translate(0, 0);
            }

            30% {
                background-position: -3px 0;
            }

            40% {
                background-position: 0 -3px;
            }

            50% {
                background-position: -3px -3px;
            }

            60% {
                background-position: 3px 3px;
            }

            70% {
                background-position: -3px 3px;
            }

            80% {
                background-position: 3px -3px;
            }

            90% {
                background-position: 0 0;
            }

            100% {
                transform: translate(0, 0);
                background-position: 0 0;
            }
        }

        /* =========================================================
           CUSTOM CURSOR
        ========================================================= */

        #customCursor {
            position: fixed;

            left: 0;
            top: 0;

            width: 32px;
            height: 32px;

            pointer-events: none;

            z-index: 999999;

            transform:
                translate3d(-100px, -100px, 0)
                translate(-50%, -50%);

            opacity: 0;

            will-change: transform;

            transition:
                opacity 0.15s ease;
        }

        /* =========================================================
           NORMAL CURSOR
        ========================================================= */

        .cursor-main {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 20px;
            height: 20px;

            border: 2px solid rgba(255, 255, 255, 0.95);

            transform:
                translate(-50%, -50%)
                rotate(45deg);

            transition:
                width 0.15s ease,
                height 0.15s ease,
                border 0.15s ease,
                transform 0.15s ease,
                opacity 0.15s ease;

            box-shadow:
                0 0 5px rgba(255, 255, 255, 0.8),
                0 0 12px rgba(255, 255, 255, 0.25);
        }

        .cursor-center {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 4px;
            height: 4px;

            background: #fff;

            border-radius: 50%;

            transform: translate(-50%, -50%);

            box-shadow:
                0 0 4px rgba(255, 255, 255, 1),
                0 0 10px rgba(255, 255, 255, 0.7);

            transition:
                width 0.15s ease,
                height 0.15s ease;
        }

        /* =========================================================
           HOVER CURSOR
        ========================================================= */

        #customCursor.hover .cursor-main {
            width: 30px;
            height: 30px;

            border-radius: 50%;

            transform:
                translate(-50%, -50%)
                rotate(0deg);

            border-width: 2px;

            box-shadow:
                0 0 6px rgba(255, 255, 255, 0.9),
                0 0 16px rgba(255, 255, 255, 0.4);
        }

        #customCursor.hover .cursor-center {
            width: 7px;
            height: 7px;
        }

        /* Four hover lines */

        .hover-line {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 9px;
            height: 2px;

            background: #fff;

            border-radius: 2px;

            opacity: 0;

            transform-origin: left center;

            transition:
                opacity 0.12s ease,
                width 0.12s ease;
        }

        #customCursor.hover .hover-line {
            opacity: 1;
            width: 11px;
        }

        .hover-line.top {
            transform:
                translate(0, -50%)
                rotate(-90deg);
        }

        .hover-line.right {
            transform:
                translate(0, -50%)
                rotate(0deg);
        }

        .hover-line.bottom {
            transform:
                translate(0, -50%)
                rotate(90deg);
        }

        .hover-line.left {
            transform:
                translate(0, -50%)
                rotate(180deg);
        }

        /* =========================================================
           CLICK CURSOR
        ========================================================= */

        #customCursor.click .cursor-main {
            width: 13px;
            height: 13px;

            border-radius: 50%;

            border-width: 3px;

            transform:
                translate(-50%, -50%)
                rotate(0deg);

            box-shadow:
                0 0 8px rgba(255, 255, 255, 1),
                0 0 18px rgba(255, 255, 255, 0.6);
        }

        #customCursor.click .cursor-center {
            width: 3px;
            height: 3px;
        }

        /* Click expanding ring */

        .click-ring {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 12px;
            height: 12px;

            border: 2px solid rgba(255, 255, 255, 0.9);

            border-radius: 50%;

            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 0;

            pointer-events: none;
        }

        #customCursor.click .click-ring {
            animation: clickExpand 0.28s ease-out;
        }

        @keyframes clickExpand {
            0% {
                width: 12px;
                height: 12px;

                opacity: 1;
            }

            100% {
                width: 46px;
                height: 46px;

                opacity: 0;
            }
        }

        /* =========================================================
           EXTRA HOVER PULSE
        ========================================================= */

        #customCursor.hover .cursor-center {
            animation: hoverPulse 0.8s ease-in-out infinite;
        }

        @keyframes hoverPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                transform: translate(-50%, -50%) scale(1.25);
            }
        }

        /* =========================================================
           TOUCH DEVICES
        ========================================================= */

        @media (hover: none) and (pointer: coarse) {
            html,
            body,
            body * {
                cursor: auto !important;
            }

            #customCursor {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- MAIN CONTENT -->
    <iframe
        id="contentFrame"
        src="about:blank"
        allowfullscreen>
    </iframe>

    <!-- STATIC OVERLAY -->
    <div id="staticOverlay"></div>

    <!-- =========================================================
         CUSTOM CURSOR
    ========================================================= -->

    <div id="customCursor">

        <!-- Main cursor shape -->
        <div class="cursor-main"></div>

        <!-- Center point -->
        <div class="cursor-center"></div>

        <!-- Hover crosshair lines -->
        <div class="hover-line top"></div>
        <div class="hover-line right"></div>
        <div class="hover-line bottom"></div>
        <div class="hover-line left"></div>

        <!-- Click expanding ring -->
        <div class="click-ring"></div>

    </div>

    <script>
        (() => {
            "use strict";

            const cursor = document.getElementById("customCursor");

            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;

            let cursorX = mouseX;
            let cursorY = mouseY;

            let mouseActive = false;

            /*
             * Smoothness
             */
            const SMOOTHNESS = 0.24;

            /*
             * Current cursor state
             */
            let hoverState = false;

            /* =====================================================
               SMOOTH CURSOR MOVEMENT
            ===================================================== */

            function updateCursor() {
                cursorX += (mouseX - cursorX) * SMOOTHNESS;
                cursorY += (mouseY - cursorY) * SMOOTHNESS;

                cursor.style.transform =
                    `translate3d(${cursorX}px, ${cursorY}px, 0) translate(-50%, -50%)`;

                requestAnimationFrame(updateCursor);
            }

            updateCursor();

            /* =====================================================
               MOUSE MOVE
            ===================================================== */

            document.addEventListener("mousemove", (event) => {
                mouseX = event.clientX;
                mouseY = event.clientY;

                if (!mouseActive) {
                    mouseActive = true;

                    cursorX = mouseX;
                    cursorY = mouseY;

                    cursor.style.opacity = "1";
                }
            });

            /* =====================================================
               MOUSE ENTER
            ===================================================== */

            document.addEventListener("mouseenter", () => {
                mouseActive = true;
                cursor.style.opacity = "1";
            });

            /* =====================================================
               MOUSE LEAVE
            ===================================================== */

            document.addEventListener("mouseleave", () => {
                mouseActive = false;
                cursor.style.opacity = "0";

                cursor.classList.remove("hover");
                cursor.classList.remove("click");
            });

            /* =====================================================
               CHECK IF ELEMENT IS CLICKABLE
            ===================================================== */

            function isClickable(element) {
                if (!(element instanceof HTMLElement)) {
                    return false;
                }

                if (
                    element.tagName === "A" ||
                    element.tagName === "BUTTON" ||
                    element.tagName === "INPUT" ||
                    element.tagName === "TEXTAREA" ||
                    element.tagName === "SELECT" ||
                    element.tagName === "OPTION"
                ) {
                    return true;
                }

                if (element.hasAttribute("onclick")) {
                    return true;
                }

                if (element.closest("a")) {
                    return true;
                }

                if (element.closest("button")) {
                    return true;
                }

                if (element.closest("[role='button']")) {
                    return true;
                }

                if (element.closest("[data-clickable]")) {
                    return true;
                }

                return false;
            }

            /* =====================================================
               HOVER DETECTION
            ===================================================== */

            document.addEventListener("mouseover", (event) => {
                const target = event.target;

                if (isClickable(target)) {
                    if (!hoverState) {
                        hoverState = true;
                        cursor.classList.add("hover");
                    }
                }
            });

            document.addEventListener("mouseout", (event) => {
                const target = event.target;
                const related = event.relatedTarget;

                if (!related || !isClickable(related)) {
                    if (isClickable(target)) {
                        hoverState = false;
                        cursor.classList.remove("hover");
                    }
                }
            });

            /* =====================================================
               CLICK CURSOR
            ===================================================== */

            document.addEventListener("mousedown", (event) => {
                if (event.button !== 0) {
                    return;
                }

                cursor.classList.add("click");

                /*
                 * Restart click ring animation every click.
                 */
                const ring = cursor.querySelector(".click-ring");

                if (ring) {
                    ring.style.animation = "none";

                    void ring.offsetWidth;

                    ring.style.animation =
                        "clickExpand 0.28s ease-out";
                }
            });

            /* =====================================================
               RELEASE CLICK CURSOR
            ===================================================== */

            document.addEventListener("mouseup", (event) => {
                if (event.button !== 0) {
                    return;
                }

                cursor.classList.remove("click");
            });

            /* =====================================================
               CANCEL CLICK STATE
            ===================================================== */

            document.addEventListener("blur", () => {
                cursor.classList.remove("click");
                cursor.classList.remove("hover");
            });

            window.addEventListener("blur", () => {
                cursor.classList.remove("click");
                cursor.classList.remove("hover");
            });

            /* =====================================================
               KEYBOARD FOCUS
            ===================================================== */

            document.addEventListener("keydown", (event) => {
                if (event.key === "Tab") {
                    cursor.style.opacity = "0";
                }
            });

            document.addEventListener("mousemove", () => {
                if (mouseActive) {
                    cursor.style.opacity = "1";
                }
            });

        })();
    </script>

</body>
</html>
