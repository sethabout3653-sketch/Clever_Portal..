<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lucide</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      cursor: none;
    }

    .wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Transparent hit-box overlay to capture hover coordinates */
    .cursor-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      background: transparent;
    }

    /* Rendered Custom Cursor Image */
    #custom-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      pointer-events: none;
      background-image: url('https://pngimg.com/uploads/cursor/cursor_PNG50.png');
      background-size: contain;
      background-repeat: no-repeat;
      z-index: 999999;
      display: none;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="cursor-overlay" id="overlay"></div>

    <iframe 
      src="https://cdn.jsdelivr.net/gh/lucideproxy/svg@latest/logo.svg#/"
      allow="fullscreen; microphone; camera; display-capture; autoplay; clipboard-write; web-share"
      allowfullscreen
      sandbox="allow-scripts allow-same-origin allow-forms"
    >
    </iframe>
  </div>

  <div id="custom-cursor"></div>

  <script>
    const cursor = document.getElementById('custom-cursor');
    const overlay = document.getElementById('overlay');

    // Move custom cursor graphic on mouse hover
    document.addEventListener('mousemove', (e) => {
      cursor.style.display = 'block';
      cursor.style.left = `${e.clientX}px`;
      cursor.style.top = `${e.clientY}px`;
    });

    // Momentarily pass clicks directly through to iframe content when user taps
    overlay.addEventListener('mousedown', () => {
      overlay.style.pointerEvents = 'none';
      
      // Re-enable cursor tracking immediately after click registers
      setTimeout(() => {
        overlay.style.pointerEvents = 'auto';
      }, 100);
    });

    // Hide custom cursor graphic when mouse leaves the browser window
    document.addEventListener('mouseleave', () => {
      cursor.style.display = 'none';
    });
  </script>

</body>
</html>
